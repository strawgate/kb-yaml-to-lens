---
# Docker Compose for integration tests with Elasticsearch and Kibana
# Used by pytest-docker to spin up services for testing dashboard compilation
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: kb-yaml-test-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - cluster.name=kb-yaml-test
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - ${ELASTIC_PORT:-9200}:9200
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s http://localhost:9200/_cluster/health | grep -q '"status":"\(green\|yellow\)"'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kb-yaml-test-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - SERVER_HOST=0.0.0.0
      - XPACK_REPORTING_ENABLED=true
      - XPACK_REPORTING_KIBANASERVER_HOSTNAME=localhost
    ports:
      - ${KIBANA_PORT:-5601}:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s http://localhost:5601/api/status | grep -q '"overall":{"level":"available"}'
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
volumes:
  elasticsearch-data:
    driver: local
