---
# Demo dashboard showing breakdown_by feature for XY and Metric charts
# This demonstrates the new multi-field breakdown capability
title: Multi-Field Breakdown Demo
description: Demonstrates the breakdown_by feature with 1-4 fields for XY and Metric charts
panels:
  # XY Chart with single-field breakdown
  - title: XY Chart - Single Field Breakdown
    type: bar
    data_view: logs-*
    dimension:
      type: date_histogram
      field: '@timestamp'
    metrics:
      - aggregation: count
    breakdown_by:
      operation: terms
      fields:
        - product.category
      size: 10

  # XY Chart with two-field breakdown
  - title: XY Chart - Two Field Breakdown
    type: line
    data_view: logs-*
    dimension:
      type: date_histogram
      field: '@timestamp'
    metrics:
      - aggregation: sum
        field: bytes
    breakdown_by:
      operation: terms
      fields:
        - product.category
        - customer.region
      size: 10
      sort:
        by: Count
        direction: desc

  # XY Chart with four-field breakdown (maximum)
  - title: XY Chart - Four Field Breakdown (Max)
    type: area
    data_view: metrics-*
    dimension:
      type: date_histogram
      field: '@timestamp'
    metrics:
      - aggregation: avg
        field: response_time
    breakdown_by:
      operation: terms
      fields:
        - service.name
        - environment
        - region
        - availability_zone
      size: 5

  # Metric Chart with single-field breakdown
  - title: Metric - Single Field Breakdown
    type: metric
    data_view: logs-*
    primary:
      aggregation: count
    breakdown_by:
      operation: terms
      fields:
        - service.name
      size: 5

  # Metric Chart with multi-field breakdown (only first field used)
  - title: Metric - Multi Field (First Only Used)
    type: metric
    data_view: logs-*
    primary:
      aggregation: sum
      field: bytes
      label: Total Bytes
    breakdown_by:
      operation: terms
      fields:
        - product.category  # This field is used
        - customer.region  # This field is IGNORED (Kibana limitation)
      size: 10
      sort:
        by: Total Bytes
        direction: desc
      other_bucket: true

  # XY Chart with breakdown_by and all options
  - title: XY Chart - Breakdown with All Options
    type: bar
    data_view: logs-*
    dimension:
      type: date_histogram
      field: '@timestamp'
    metrics:
      - aggregation: count
        label: Event Count
    breakdown_by:
      operation: terms
      fields:
        - geo.src
        - geo.dest
      size: 20
      collapse: sum
      sort:
        by: Event Count
        direction: desc
      other_bucket: true
      missing_bucket: false
      include:
        - US
        - EU
      include_is_regex: false
