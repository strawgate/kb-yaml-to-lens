---
name: 'Explore: ES|QL Panels'
on:
  schedule:
    - cron: 20 12 * * 1-5
  workflow_dispatch:
    inputs:
      kibana_version:
        description: 'Kibana version to test (leave empty for all)'
        required: false
        type: string
        default: ''
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
  discussions: write
  id-token: write
concurrency:
  group: explore-esql-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          INPUT_VERSION="${{ inputs.kibana_version }}"
          if [ -n "$INPUT_VERSION" ]; then
            echo "matrix={\"kibana_version\":[\"$INPUT_VERSION\"]}" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"kibana_version":["8.19.0","9.3.0"]}' >> "$GITHUB_OUTPUT"
          fi
  explore:
    needs: generate-matrix
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-internal-gemini-cli.lock.yml@main
    with:
      title-prefix: '[explore-esql-${{ matrix.kibana_version }}]'
      setup-commands: |
        make install-just
        uv sync
        npx playwright install chromium
        just explore-bootstrap ${{ matrix.kibana_version }}
      additional-instructions: |
        You are running the ES|QL Panels Explorer for kb-yaml-to-lens.
        **IMPORTANT**: Read `.github/agent-guides/kibana-lens-playwright.md` FIRST.

        ## Mission
        Systematically test every config option for **ES|QL** panels across all
        supported chart types against **Kibana ${{ matrix.kibana_version }}**.
        Author YAML configs, compile them, import into Kibana, and verify every
        setting renders correctly.

        ## Inputs
        - Kibana URL: `http://localhost:5601`
        - Elasticsearch URL: `http://localhost:9200`
        - Data views: `logs-*`, `metrics-*`
        - Kibana version: `${{ matrix.kibana_version }}`
        - Elasticsearch and Kibana are pre-provisioned. Do NOT run bootstrap scripts.

        ## ES|QL query configuration
        Queries can be specified as:
        - A single string: `query: "FROM logs-* | STATS count = COUNT()"`
        - A list of strings (joined with pipes):
          ```yaml
          query:
            - FROM logs-*
            - WHERE @timestamp > NOW() - 1h
            - STATS count = COUNT()
          ```
        - `time_field` (optional, default: `@timestamp`) — used for time picker

        ## Supported ES|QL chart types
        All 11 types: `bar`, `line`, `area`, `metric`, `gauge`, `pie`,
        `datatable`, `heatmap`, `tagcloud`, `mosaic`, `waffle`

        ## ES|QL column configuration

        ### Dimensions (x-axis, group-by, slice-by)
        - `field` (required) — field name from ES|QL query result
        - `label` (optional) — custom display label
        - `data_type` (optional) — set to `'date'` for time/date fields
        - `collapse` (optional) — aggregation: `sum`, `avg`, `min`, `max`

        ### Metrics (y-axis, value, size)
        - `field` (required) — field name from ES|QL query result
        - `label` (optional) — custom display label
        - `format` (optional) — display format:
          - Standard: `number`, `bytes`, `bits`, `percent`, `duration`
          - Params: `decimals`, `suffix`, `compact`
          - Custom: `pattern` (numeral.js format)

        ## Chart-specific features to test

        ### XY Charts (bar, line, area)
        - `dimension` — x-axis (0 or 1 dimension)
        - `metrics` — y-axis (1 or more)
        - `breakdown` — series split dimension
        - Bar modes: `stacked`, `unstacked`, `percentage`
        - Area modes: `stacked`, `unstacked`, `percentage`
        - Axis configuration, legends, value labels
        - Per-metric `axis: left | right` for dual-axis
        - Per-metric `color` for custom series color

        ### Metric
        - `primary` (required) — main metric
        - `secondary` (optional) — companion metric
        - `maximum` (optional) — for progress display
        - `breakdown` (optional) — split dimension
        - `apply_to` — color on `value` or `background`

        ### Gauge
        - `metric` (required) — primary value
        - `minimum`, `maximum`, `goal` (optional)
        - `shape` — `horizontal_bullet`, `vertical_bullet`, `arc`,
          `circle`, `semi_circle`

        ### Pie
        - `dimensions` — slice-by (supports multiple for nested rings)
        - `metrics` — slice size
        - Donut settings, slice labels, legend

        ### Datatable
        - `metrics` + `dimensions` — table columns
        - `sorting`, `paging` — table behavior
        - Per-column `appearance` — width, hidden, alignment

        ### Heatmap
        - `x_axis`, `y_axis`, `value` — grid dimensions + metric

        ### Tag Cloud
        - `dimension` + `metric` — tags and sizing
        - `appearance` — font size, orientation

        ### Partition (Waffle, Mosaic)
        - `dimension`, `breakdown`, `metric`
        - Legend and color options

        ## NOT implemented for ES|QL (do NOT flag as bugs)
        - **Reference lines** — ES|QL panels do NOT support `layers` or
          `reference_line` layer types. This is Lens-only.
        - **Annotation layers** — not supported for ES|QL
        - **Multi-layer composition** — ES|QL panels are single-chart only
        - **Panel-level filters** — all filtering must be in the ES|QL query
        - **Formula metrics** — ES|QL uses query-computed columns, not formulas
        - **Aggregation functions in metrics** — ES|QL metrics reference query
          result columns; aggregations must be done in the query via STATS
        - Tooltip configuration — no compiler option

        ## Creative exploration
        After covering the feature matrix, try interesting combinations:
        - ES|QL bar chart with STATS ... BY for grouped aggregations
        - ES|QL line chart with EVAL + BUCKET for date histogram
        - ES|QL metric with secondary metric from same query
        - ES|QL datatable with multiple STATS columns + sorting
        - ES|QL pie chart with multi-level grouping
        - ES|QL gauge with computed min/max from query
        - ES|QL heatmap with 2D STATS bucketing
        - ES|QL tag cloud from top terms query
        - ES|QL with EVAL constants for computed fields
        - ES|QL with complex WHERE clauses and time filtering
        - Compare ES|QL panel appearance vs equivalent Lens panel

        ## Required process
        1. Read compiler source for ES|QL chart configs.
        2. For EACH chart type and feature: author YAML, compile, import,
           verify in editor, manually recreate, export both, compare, record.
        3. Note behavioral differences specific to Kibana ${{ matrix.kibana_version }}.
        4. Document ES|QL vs Lens parity gaps for each chart type.

        ## Deliverable
        Create one GitHub issue titled:
        `[explore-esql-${{ matrix.kibana_version }}] Feature coverage report`

        Use **collapsed sections** (`<details>`) for: Feature Coverage Table
        (grouped by chart type), Creative Exploration Results, Bugs Found,
        ES|QL vs Lens Parity Notes, Features Not Tested.
        Top-level: summary stats and version-specific notes.

        Do not create branches or pull requests.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
