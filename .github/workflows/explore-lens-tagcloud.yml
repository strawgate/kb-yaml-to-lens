---
name: 'Explore: Lens Tag Cloud'
on:
  schedule:
    - cron: 10 12 * * 1-5
  workflow_dispatch:
    inputs:
      kibana_version:
        description: 'Kibana version to test (leave empty for all)'
        required: false
        type: string
        default: ''
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
  discussions: write
  id-token: write
concurrency:
  group: explore-lens-tagcloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          INPUT_VERSION="${{ inputs.kibana_version }}"
          if [ -n "$INPUT_VERSION" ]; then
            echo "matrix={\"kibana_version\":[\"$INPUT_VERSION\"]}" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"kibana_version":["8.19.0","9.3.0"]}' >> "$GITHUB_OUTPUT"
          fi
  explore:
    needs: generate-matrix
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-internal-gemini-cli.lock.yml@main
    with:
      title-prefix: '[explore-lens-tagcloud-${{ matrix.kibana_version }}]'
      setup-commands: |
        make install-just
        uv sync
        npx playwright install chromium
        just explore-bootstrap ${{ matrix.kibana_version }}
      additional-instructions: |
        You are running the Lens Tag Cloud Explorer for kb-yaml-to-lens.
        **IMPORTANT**: Read `.github/agent-guides/kibana-lens-playwright.md` FIRST.

        ## Mission
        Systematically test every config option for **tag cloud** Lens charts
        against **Kibana ${{ matrix.kibana_version }}**. Author YAML configs,
        compile them, import into Kibana, and verify every setting renders correctly.

        ## Inputs
        - Kibana URL: `http://localhost:5601`
        - Elasticsearch URL: `http://localhost:9200`
        - Data views: `logs-*`, `metrics-*`
        - Kibana version: `${{ matrix.kibana_version }}`
        - Elasticsearch and Kibana are pre-provisioned. Do NOT run bootstrap scripts.

        ## Compiler-supported features to test

        ### Config slots
        - **dimension** (required) — tags/grouping dimension
        - **metric** (required) — determines tag size

        ### Dimension types
        - `type: values` — top values/terms with `field`, `size`, `other_bucket`,
          `missing_bucket`, `include`/`exclude` (regex support), `collapse`
        - `type: date_histogram` — with `field`, `minimum_interval`,
          `partial_intervals`
        - `type: intervals` — numeric ranges with `granularity`
        - `type: filters` — KQL filter-based with `filters: [{query, label}]`
        - Multi-field terms via `fields: [field1, field2]` (min 2)

        ### Metric types
        All standard aggregations: `count`, `sum`, `average`, `min`, `max`,
        `median`, `unique_count`, `last_value`, `percentile`, `percentile_rank`,
        `standard_deviation`, `formula`
        - Static values via `value: N`

        ### Appearance (`appearance:`)
        - `min_font_size` — minimum font size in pixels (1-100, default: 12)
        - `max_font_size` — maximum font size in pixels (1-200, default: 72)
        - `orientation` — `single` (default, all horizontal), `right angled`
          (mix of 0° and 90°), `multiple` (multiple angles including diagonal)
        - `show_label` — boolean (default: true)

        ### Color (`color:`)
        - `palette` — categorical color scheme (e.g. `eui_amsterdam_color_blind`,
          `default`, `kibana_palette`, `elastic_brand`, `gray`)
        - `assignments` — manual value-to-color hex mappings
          `[{value: "term", color: "#hex"}]`

        ## NOT implemented in compiler (do NOT flag as bugs)
        - Legend — tag clouds do not have a legend option in the compiler
        - Tooltip configuration — no compiler option
        - Custom word spacing or layout algorithm control

        ## Creative exploration
        After covering the feature matrix, try interesting combinations:
        - Tag cloud with top 20 terms + custom color assignments per value
        - Tag cloud with `right angled` orientation + large font range (8-120)
        - Tag cloud with `multiple` orientation + formula metric
        - Tag cloud with filters dimension (error vs warning vs info)
        - Tag cloud with `show_label: false` + `min_font_size: 24`
        - Tag cloud with multi-field terms dimension
        - Tag cloud with unique_count metric
        - Tag cloud inside a collapsible section

        ## Required process — round-trip verification

        The primary goal is to find **compiler bugs** by comparing compiled
        output against Kibana's own output. Missing features are secondary.

        ### Step 1: Read compiler source
        Read the relevant compiler source in `packages/kb-dashboard-core/src/`
        to understand every supported config option.

        ### Step 2: For EACH feature, do a full round-trip comparison
        a. **Author** a minimal YAML config exercising the feature.
        b. **Compile** it: `just cli compile --input <file> --output /tmp/compiled/`
        c. **Import** the compiled NDJSON into Kibana via the saved objects API:
           `curl -X POST "http://localhost:5601/api/saved_objects/_import?overwrite=true" -H "kbn-xsrf: true" --form file=@/tmp/compiled/<file>.ndjson`
        d. **Open** the imported panel in the Kibana Lens editor and verify
           that all settings rendered correctly.
        e. **Manually recreate** the EXACT same panel in Kibana from scratch:
           create a new Lens visualization, set every option to match what
           the YAML config specified, and save it.
        f. **Export** both the compiled panel and the manually-created panel
           from Kibana's saved objects API:
           `curl "http://localhost:5601/api/saved_objects/_export" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"type":"dashboard","includeReferencesDeep":true}'`
        g. **Normalize** and **diff** the JSON of both panels — strip IDs,
           timestamps, and other non-deterministic fields, then compare.
           Structural differences indicate a **compiler bug**.
        h. **Record** each feature: name, YAML config used, whether the
           compiled output matched Kibana's native output, and any diffs.

        ### Step 3: Classify findings
        - **Bug**: Compiled JSON differs structurally from Kibana-native JSON
          for the same settings. Include the normalized JSON diff.
        - **Gap**: Feature exists in Kibana but is not in the compiler's config
          schema. Note it but do NOT treat it as a bug.
        - **Pass**: Compiled output matches Kibana-native output exactly.

        ### Step 4: Note version-specific behavior
        Document any differences specific to Kibana ${{ matrix.kibana_version }}.

        ## Deliverable

        **If no bugs are found**, do NOT create an issue. Instead, add a
        single comment to issue #1301 stating that all tested features passed
        round-trip verification for this chart type and Kibana version.

        **If bugs or significant findings exist**, create one GitHub issue titled:
        `[explore-lens-tagcloud-${{ matrix.kibana_version }}] Round-trip verification report`

        Structure the issue body with these **collapsed sections** (`<details>`):

        <details><summary>Compiler Bugs (JSON diffs)</summary>
        For each bug: feature name, YAML config, expected JSON (from Kibana),
        actual JSON (from compiler), and the normalized diff.
        </details>

        <details><summary>Features Verified (passed round-trip)</summary>
        | Feature | YAML Config | Status | Notes |
        </details>

        <details><summary>Feature Gaps (not in compiler)</summary>
        Features that exist in Kibana but have no compiler support.
        </details>

        <details><summary>Creative Exploration Results</summary>
        Document each interesting combination attempted and outcome.
        </details>

        Top-level summary: total features tested, passed, bugs found,
        gaps identified, version-specific notes.

        Do not create branches or pull requests.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
