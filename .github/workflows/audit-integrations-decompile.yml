---
name: 'Audit: Integrations Decompile Fuzz'
on:
  schedule:
    - cron: 30 12 * * 3
  workflow_dispatch: null
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-scheduled-audit.lock.yml@main
    with:
      title-prefix: '[integrations-decompile-fuzz]'
      setup-commands: |
        command -v just >/dev/null 2>&1 || make install-just
        just all install
        git clone --depth=1 --filter=blob:none --sparse https://github.com/elastic/integrations.git integrations
        cd integrations && git sparse-checkout set 'packages/*/kibana/dashboard' && cd ..
        python <<'PY'
        import csv
        import json
        import traceback
        from collections import defaultdict
        from pathlib import Path

        from kb_dashboard_tools.decompile import decompile_dashboard

        root = Path.cwd()
        integrations = root / "integrations"
        audit_dir = root / ".audit" / "decompile"
        audit_dir.mkdir(parents=True, exist_ok=True)

        json_files = sorted(integrations.glob("packages/*/kibana/dashboard/*.json"))

        if not json_files:
            raise SystemExit("FATAL: discovered 0 JSON dashboard files — check the sparse checkout")

        successes = 0
        failures = 0
        error_rows = []
        error_groups = defaultdict(lambda: {"count": 0, "message": "", "example_files": []})
        full_tracebacks = []

        for json_file in json_files:
            rel = json_file.relative_to(integrations).as_posix()
            try:
                dashboard = json.loads(json_file.read_text(encoding="utf-8"))
                decompile_dashboard(dashboard)
                successes += 1
            except Exception as exc:
                failures += 1
                etype = type(exc).__name__
                emsg = str(exc)
                group_key = f"{etype}: {emsg[:200]}"
                error_rows.append({"file": rel, "error_type": etype, "error_message": emsg})
                g = error_groups[group_key]
                g["count"] += 1
                if not g["message"]:
                    g["message"] = emsg
                if len(g["example_files"]) < 5:
                    g["example_files"].append(rel)
                full_tracebacks.append(f"\n=== {rel} ===\n{traceback.format_exc()}")

        total = len(json_files)
        rate = f"{successes * 100 // total}%" if total else "n/a"
        summary = {
            "total": total,
            "successes": successes,
            "failures": failures,
            "success_rate": rate,
            "unique_error_types": len(error_groups),
        }
        (audit_dir / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")

        sorted_groups = dict(sorted(error_groups.items(), key=lambda x: x[1]["count"], reverse=True))
        (audit_dir / "errors_by_type.json").write_text(json.dumps(sorted_groups, indent=2), encoding="utf-8")

        with (audit_dir / "failures.csv").open("w", newline="", encoding="utf-8") as f:
            writer = csv.DictWriter(f, fieldnames=["file", "error_type", "error_message"])
            writer.writeheader()
            writer.writerows(error_rows)

        (audit_dir / "errors.log").write_text("\n".join(full_tracebacks).strip() + "\n" if full_tracebacks else "", encoding="utf-8")

        print(json.dumps(summary, indent=2))
        PY
      additional-instructions: |
        You are auditing the kb-yaml-to-lens decompiler against all JSON dashboards in elastic/integrations.
        Setup has already cloned integrations and run `kb-dashboard decompile` on every dashboard.

        Artifacts:
        - `.audit/decompile/summary.json` — total/success/failure counts and unique error types
        - `.audit/decompile/errors_by_type.json` — errors grouped by type with counts and example files
        - `.audit/decompile/failures.csv` — every failure with file, error_type, error_message
        - `.audit/decompile/errors.log` — full tracebacks for each failure

        ## Mission
        Produce one high-signal issue that summarizes decompiler fuzz results.

        ## Required process
        - Read `summary.json` for the overview.
        - Read `errors_by_type.json` for grouped error analysis.
        - Classify each error group as: decompiler bug, unsupported feature, or malformed input.
        - Prioritize by count (most frequent first).
        - Do not open PRs; open a single issue only.

        ## Issue content
        1. **Summary table:** total dashboards, successes, failures, success rate
        2. **Grouped errors table:** error message, count, example files, likely root cause
        3. **Actionable recommendations** prioritized by impact

        ## Issue title
        Use: `N dashboards tested, X succeeded, Y failed`
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
