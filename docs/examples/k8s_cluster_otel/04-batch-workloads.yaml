---
# Kubernetes Cluster Batch Workloads Dashboard
# Job and CronJob monitoring - "Are my jobs completing? What's failing?"
dashboards:
  - id: k8s-cluster-batch
    name: '[Metrics K8s Cluster] Batch Workloads'
    description: Job and CronJob execution status and completion tracking
    controls:
      - type: options
        label: Namespace
        data_view: metrics-*
        field: k8s.namespace.name
      - type: options
        label: Job
        data_view: metrics-*
        field: k8s.job.name
    filters:
      - field: data_stream.dataset
        equals: kubernetesclusterreceiver.otel
    panels:
      # Navigation
      - title: Navigation Links
        grid: {x: 0, y: 0, w: 48, h: 3}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: k8s-cluster-overview
            - label: Resources
              dashboard: k8s-cluster-resources
            - label: Workloads
              dashboard: k8s-cluster-workloads
            - label: Batch Jobs
              dashboard: k8s-cluster-batch
            - label: Autoscaling
              dashboard: k8s-cluster-hpa

      # Section: Job Summary
      - title: Job Summary
        grid: {x: 0, y: 3, w: 48, h: 2}
        markdown:
          content: "## Job Summary\nCurrent status of Jobs and CronJobs across the cluster"
          font_size: 12
      - title: Active Jobs
        grid: {x: 0, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.job.active_pods)
            label: Active
          filters:
            - exists: k8s.job.name
      - title: Successful Jobs
        grid: {x: 12, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.job.successful_pods)
            label: Successful
          filters:
            - exists: k8s.job.name
      - title: Failed Jobs
        grid: {x: 24, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.job.failed_pods)
            label: Failed
          filters:
            - exists: k8s.job.name
      - title: CronJob Active Jobs
        grid: {x: 36, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.cronjob.active_jobs)
            label: Active
          filters:
            - exists: k8s.cronjob.name

      # Section: Job Trends
      - title: Job Execution Trends
        grid: {x: 0, y: 11, w: 48, h: 2}
        markdown:
          content: "## Job Execution Trends\nJob completion and failure patterns over time"
          font_size: 12
      - title: Job Completion Trends
        grid: {x: 0, y: 13, w: 48, h: 12}
        lens:
          type: area
          mode: stacked
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.job.successful_pods)
              label: Successful
            - formula: sum(k8s.job.failed_pods)
              label: Failed
            - formula: sum(k8s.job.active_pods)
              label: Active
          filters:
            - exists: k8s.job.name
          color:
            palette: eui_amsterdam_color_blind
            assignments:
              - value: Successful
                color: '#54B399'
              - value: Failed
                color: '#D36086'
              - value: Active
                color: '#6092C0'

      # Section: Job Details
      - title: Job Details
        grid: {x: 0, y: 25, w: 48, h: 2}
        markdown:
          content: "## Job Details\nDrill down to individual job status"
          font_size: 12
      - title: Jobs by Status
        grid: {x: 0, y: 27, w: 48, h: 12}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - field: k8s.job.name
              type: values
              size: 20
              label: Job
            - field: k8s.namespace.name
              type: values
              size: 1
              label: Namespace
          metrics:
            - field: k8s.job.active_pods
              aggregation: max
              label: Active
            - field: k8s.job.successful_pods
              aggregation: max
              label: Successful
            - field: k8s.job.failed_pods
              aggregation: max
              label: Failed
            - field: k8s.job.desired_successful_pods
              aggregation: max
              label: Desired
          filters:
            - exists: k8s.job.name
