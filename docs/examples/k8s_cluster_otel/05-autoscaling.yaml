---
# Kubernetes Cluster Autoscaling Dashboard
# HPA monitoring - "Is autoscaling working? Am I hitting limits?"
dashboards:
  - id: k8s-cluster-hpa
    name: '[Metrics K8s Cluster] Autoscaling'
    description: Horizontal Pod Autoscaler scaling behavior and capacity tracking
    controls:
      - type: options
        label: Namespace
        data_view: metrics-*
        field: k8s.namespace.name
      - type: options
        label: HPA
        data_view: metrics-*
        field: k8s.hpa.name
    filters:
      - field: data_stream.dataset
        equals: kubernetesclusterreceiver.otel
    panels:
      # Navigation
      - title: Navigation Links
        grid: {x: 0, y: 0, w: 48, h: 3}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: k8s-cluster-overview
            - label: Resources
              dashboard: k8s-cluster-resources
            - label: Workloads
              dashboard: k8s-cluster-workloads
            - label: Batch Jobs
              dashboard: k8s-cluster-batch
            - label: Autoscaling
              dashboard: k8s-cluster-hpa

      # Section: HPA Summary
      - title: HPA Summary
        grid: {x: 0, y: 3, w: 48, h: 2}
        markdown:
          content: "## HPA Summary\nHorizontal Pod Autoscaler replica counts and capacity"
          font_size: 12
      - title: Total HPAs
        grid: {x: 0, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: unique_count(k8s.hpa.name)
            label: HPAs
          filters:
            - exists: k8s.hpa.name
      - title: Current Replicas
        grid: {x: 12, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.hpa.current_replicas)
            label: Current
          filters:
            - exists: k8s.hpa.name
      - title: Desired Replicas
        grid: {x: 24, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.hpa.desired_replicas)
            label: Desired
          filters:
            - exists: k8s.hpa.name
      - title: Max Replicas Limit
        grid: {x: 36, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.hpa.max_replicas)
            label: Total Max
          filters:
            - exists: k8s.hpa.name

      # Section: HPA Scaling Trends
      - title: HPA Scaling Trends
        grid: {x: 0, y: 11, w: 48, h: 2}
        markdown:
          content: "## HPA Scaling Trends\nReplica scaling behavior and capacity utilization over time"
          font_size: 12
      - title: HPA Replica Scaling Over Time
        grid: {x: 0, y: 13, w: 24, h: 12}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.hpa.current_replicas)
              label: Current Replicas
            - formula: sum(k8s.hpa.desired_replicas)
              label: Desired Replicas
          filters:
            - exists: k8s.hpa.name
      - title: HPA Capacity Overview
        grid: {x: 24, y: 13, w: 24, h: 12}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.hpa.min_replicas)
              label: Min Replicas
            - formula: sum(k8s.hpa.current_replicas)
              label: Current Replicas
            - formula: sum(k8s.hpa.max_replicas)
              label: Max Replicas
          filters:
            - exists: k8s.hpa.name

      # Section: HPA Details
      - title: HPA Details
        grid: {x: 0, y: 25, w: 48, h: 2}
        markdown:
          content: "## HPA Details\nDrill down to individual HPA configurations and status"
          font_size: 12
      - title: HPA Status by Name
        grid: {x: 0, y: 27, w: 48, h: 12}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - field: k8s.hpa.name
              type: values
              size: 20
              label: HPA
            - field: k8s.namespace.name
              type: values
              size: 1
              label: Namespace
          metrics:
            - field: k8s.hpa.current_replicas
              aggregation: max
              label: Current
            - field: k8s.hpa.desired_replicas
              aggregation: max
              label: Desired
            - field: k8s.hpa.min_replicas
              aggregation: max
              label: Min
            - field: k8s.hpa.max_replicas
              aggregation: max
              label: Max
          filters:
            - exists: k8s.hpa.name
