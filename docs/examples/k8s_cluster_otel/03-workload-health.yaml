---
# Kubernetes Cluster Workload Health Dashboard
# Application health monitoring - "Are my deployments healthy? What's crashing?"
dashboards:
  - id: k8s-cluster-workloads
    name: '[Metrics K8s Cluster] Workload Health'
    description: Deployment, StatefulSet, DaemonSet, and container health monitoring
    controls:
      - type: options
        label: Namespace
        data_view: metrics-*
        field: k8s.namespace.name
      - type: options
        label: Deployment
        data_view: metrics-*
        field: k8s.deployment.name
    filters:
      - field: data_stream.dataset
        equals: kubernetesclusterreceiver.otel
    panels:
      # Navigation
      - title: Navigation Links
        grid: {x: 0, y: 0, w: 48, h: 3}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: k8s-cluster-overview
            - label: Resources
              dashboard: k8s-cluster-resources
            - label: Workloads
              dashboard: k8s-cluster-workloads
            - label: Batch Jobs
              dashboard: k8s-cluster-batch
            - label: Autoscaling
              dashboard: k8s-cluster-hpa

      # Section: Deployment Health
      - title: Deployment Health
        grid: {x: 0, y: 3, w: 48, h: 2}
        markdown:
          content: "## Deployment Health\nCompare desired vs available replicas across workload controllers"
          font_size: 12
      - title: Deployments - Desired vs Available
        grid: {x: 0, y: 5, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.deployment.desired)
              label: Desired
            - formula: sum(k8s.deployment.available)
              label: Available
          filters:
            - exists: k8s.deployment.name
      - title: StatefulSets - Current vs Ready
        grid: {x: 24, y: 5, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.statefulset.current_pods)
              label: Current
            - formula: sum(k8s.statefulset.ready_pods)
              label: Ready
          filters:
            - exists: k8s.statefulset.name
      - title: DaemonSets - Desired vs Ready Nodes
        grid: {x: 0, y: 15, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.daemonset.desired_scheduled_nodes)
              label: Desired Nodes
            - formula: sum(k8s.daemonset.ready_nodes)
              label: Ready Nodes
            - formula: sum(k8s.daemonset.current_scheduled_nodes)
              label: Current Nodes
          filters:
            - exists: k8s.daemonset.name
      - title: ReplicaSets - Desired vs Available
        grid: {x: 24, y: 15, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.replicaset.desired)
              label: Desired
            - formula: sum(k8s.replicaset.available)
              label: Available
          filters:
            - exists: k8s.replicaset.name

      # Section: Workload Status Tables
      - title: Workload Status Details
        grid: {x: 0, y: 25, w: 48, h: 2}
        markdown:
          content: "## Workload Status Details\nDrill down to individual workload health status"
          font_size: 12
      - title: Deployments by Status
        grid: {x: 0, y: 27, w: 24, h: 10}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - field: k8s.deployment.name
              type: values
              size: 20
              label: Deployment
            - field: k8s.namespace.name
              type: values
              size: 1
              label: Namespace
          metrics:
            - field: k8s.deployment.desired
              aggregation: max
              label: Desired
            - field: k8s.deployment.available
              aggregation: max
              label: Available
          filters:
            - exists: k8s.deployment.name
      - title: StatefulSets by Status
        grid: {x: 24, y: 27, w: 24, h: 10}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - field: k8s.statefulset.name
              type: values
              size: 20
              label: StatefulSet
            - field: k8s.namespace.name
              type: values
              size: 1
              label: Namespace
          metrics:
            - field: k8s.statefulset.desired_pods
              aggregation: max
              label: Desired
            - field: k8s.statefulset.ready_pods
              aggregation: max
              label: Ready
            - field: k8s.statefulset.current_pods
              aggregation: max
              label: Current
          filters:
            - exists: k8s.statefulset.name

      # Section: Container Health
      - title: Container Health
        grid: {x: 0, y: 37, w: 48, h: 2}
        markdown:
          content: "## Container Health\nContainer readiness and restart patterns"
          font_size: 12
      - title: Ready Containers
        grid: {x: 0, y: 39, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Ready
          filters:
            - field: k8s.container.ready
              equals: '1'
      - title: Not Ready Containers
        grid: {x: 12, y: 39, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Not Ready
          filters:
            - field: k8s.container.ready
              equals: '0'
      - title: Total Containers
        grid: {x: 24, y: 39, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Total
          filters:
            - exists: k8s.container.name
      - title: Containers with Restarts
        grid: {x: 36, y: 39, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Restarted
          filters:
            - field: k8s.container.restarts
              gt: '0'
      - title: Container Readiness Over Time
        grid: {x: 0, y: 45, w: 24, h: 10}
        lens:
          type: area
          mode: stacked
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          breakdown:
            field: k8s.container.ready
            type: values
            size: 2
          metrics:
            - aggregation: count
              label: Containers
          color:
            palette: eui_amsterdam_color_blind
            assignments:
              - value: '1'
                color: '#54B399'
              - value: '0'
                color: '#D36086'
      - title: Top Containers by Restart Count
        grid: {x: 24, y: 45, w: 24, h: 10}
        lens:
          type: bar
          mode: stacked
          data_view: metrics-*
          dimension:
            field: k8s.container.name
            type: values
            size: 15
            sort:
              by: Restarts
              direction: desc
          metrics:
            - field: k8s.container.restarts
              aggregation: max
              label: Restarts
          filters:
            - field: k8s.container.restarts
              gt: '0'
