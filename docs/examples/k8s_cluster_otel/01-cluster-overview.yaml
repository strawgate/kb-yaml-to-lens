---
# Kubernetes Cluster Overview Dashboard
# Entry point for SRE triage - "Is my cluster healthy? Where should I look?"
dashboards:
  - id: k8s-cluster-overview
    name: '[Metrics K8s Cluster] Overview'
    description: High-level Kubernetes cluster health and status for rapid triage
    controls:
      - type: options
        label: Namespace
        data_view: metrics-*
        field: k8s.namespace.name
    filters:
      - field: data_stream.dataset
        equals: kubernetesclusterreceiver.otel
    panels:
      # Navigation
      - title: Navigation Links
        grid: {x: 0, y: 0, w: 48, h: 3}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: k8s-cluster-overview
            - label: Resources
              dashboard: k8s-cluster-resources
            - label: Workloads
              dashboard: k8s-cluster-workloads
            - label: Batch Jobs
              dashboard: k8s-cluster-batch
            - label: Autoscaling
              dashboard: k8s-cluster-hpa

      # Cluster Summary Metrics
      - title: Total Nodes
        grid: {x: 0, y: 3, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: unique_count(k8s.node.name)
            label: Nodes
      - title: Total Pods
        grid: {x: 12, y: 3, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Pods
          filters:
            - exists: k8s.pod.name
      - title: Active Namespaces
        grid: {x: 24, y: 3, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: unique_count(k8s.namespace.name)
            label: Namespaces
          filters:
            - field: k8s.namespace.phase
              equals: '1'
      - title: Total Deployments
        grid: {x: 36, y: 3, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: unique_count(k8s.deployment.name)
            label: Deployments

      # Health Status Metrics
      - title: Running Pods
        grid: {x: 0, y: 9, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Running
          filters:
            - field: k8s.pod.phase
              equals: '2'
      - title: Pending Pods
        grid: {x: 12, y: 9, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Pending
          filters:
            - field: k8s.pod.phase
              equals: '1'
      - title: Failed Pods
        grid: {x: 24, y: 9, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Failed
          filters:
            - field: k8s.pod.phase
              equals: '4'
      - title: Container Restarts
        grid: {x: 36, y: 9, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.container.restarts)
            label: Total Restarts
          filters:
            - exists: k8s.container.restarts

      # Pod Status Analysis
      - title: Pods by Phase
        grid: {x: 0, y: 15, w: 24, h: 12}
        lens:
          type: pie
          data_view: metrics-*
          dimensions:
            - field: k8s.pod.phase
              type: values
              label: Phase
              size: 10
          metrics:
            - aggregation: count
              label: Pods
          color:
            palette: eui_amsterdam_color_blind
            assignments:
              - value: '1'
                color: '#FEC514'
              - value: '2'
                color: '#54B399'
              - value: '3'
                color: '#6092C0'
              - value: '4'
                color: '#D36086'
              - value: '5'
                color: '#9170B8'
      - title: Pod Status Over Time
        grid: {x: 24, y: 15, w: 24, h: 12}
        lens:
          type: area
          mode: stacked
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          breakdown:
            field: k8s.pod.phase
            type: values
            size: 5
          metrics:
            - aggregation: count
              label: Pods
          color:
            palette: eui_amsterdam_color_blind
            assignments:
              - value: '1'
                color: '#FEC514'
              - value: '2'
                color: '#54B399'
              - value: '3'
                color: '#6092C0'
              - value: '4'
                color: '#D36086'
              - value: '5'
                color: '#9170B8'

      # Workload Distribution
      - title: Workload Controllers
        grid: {x: 0, y: 27, w: 24, h: 12}
        lens:
          type: bar
          mode: percentage
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: unique_count(k8s.deployment.name)
              label: Deployments
            - formula: unique_count(k8s.statefulset.name)
              label: StatefulSets
            - formula: unique_count(k8s.daemonset.name)
              label: DaemonSets
            - formula: unique_count(k8s.replicaset.name)
              label: ReplicaSets
      - title: Container Restart Rate by Namespace
        grid: {x: 24, y: 27, w: 24, h: 12}
        lens:
          type: bar
          mode: stacked
          data_view: metrics-*
          dimension:
            field: k8s.namespace.name
            type: values
            size: 15
            sort:
              by: Restarts
              direction: desc
          metrics:
            - formula: sum(k8s.container.restarts)
              label: Restarts
          filters:
            - exists: k8s.container.restarts

      # Resource Summary
      - title: CPU Requests vs Limits
        grid: {x: 0, y: 39, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.container.cpu_request)
              label: CPU Requests
            - formula: sum(k8s.container.cpu_limit)
              label: CPU Limits
          filters:
            - exists: k8s.container.name
      - title: Memory Requests vs Limits
        grid: {x: 24, y: 39, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.container.memory_request)
              label: Memory Requests
              format:
                type: bytes
            - formula: sum(k8s.container.memory_limit)
              label: Memory Limits
              format:
                type: bytes
          filters:
            - exists: k8s.container.name
