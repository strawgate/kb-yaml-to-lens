---
dashboards:
  - id: k8s-cluster-overview
    name: '[Metrics K8s Cluster] Overview'
    description: Comprehensive Kubernetes cluster monitoring dashboard using OpenTelemetry k8sclusterreceiver metrics
    controls:
      - type: options
        label: Namespace
        data_view: metrics-*
        field: k8s.namespace.name
      - type: options
        label: Node
        data_view: metrics-*
        field: k8s.node.name
      - type: options
        label: Deployment
        data_view: metrics-*
        field: k8s.deployment.name
      - type: options
        label: Pod
        data_view: metrics-*
        field: k8s.pod.name
    filters:
      - field: data_stream.dataset
        equals: kubernetesclusterreceiver.otel
    panels:
      - title: Navigation Links
        grid: {x: 0, y: 0, w: 48, h: 3}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: k8s-cluster-overview
            # Placeholder links for future dashboards:
            # - label: Node Details
            #   dashboard: k8s-cluster-nodes
            # - label: Workload Analysis
            #   dashboard: k8s-cluster-workloads

      # Section 1: Cluster Overview
      - title: Cluster Overview
        grid: {x: 0, y: 3, w: 48, h: 2}
        markdown:
          content: "## Cluster Overview\nHigh-level cluster health and resource statistics"
          font_size: 12
      - title: Total Nodes
        grid: {x: 0, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: unique_count(k8s.node.name)
            label: Nodes
      - title: Total Pods
        grid: {x: 12, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Pods
          filters:
            - exists: k8s.pod.name
      - title: Active Namespaces
        grid: {x: 24, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: unique_count(k8s.namespace.name)
            label: Namespaces
          filters:
            - field: k8s.namespace.phase
              equals: '1'
      - title: Total Deployments
        grid: {x: 36, y: 5, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: unique_count(k8s.deployment.name)
            label: Deployments
      - title: Pods by Phase
        grid: {x: 0, y: 11, w: 24, h: 12}
        lens:
          type: pie
          data_view: metrics-*
          dimensions:
            - field: k8s.pod.phase
              type: values
              label: Phase
              size: 10
          metrics:
            - aggregation: count
              label: Pods
          color:
            palette: eui_amsterdam_color_blind
            assignments:
              - value: '1'
                color: '#FEC514'
              - value: '2'
                color: '#54B399'
              - value: '3'
                color: '#6092C0'
              - value: '4'
                color: '#D36086'
              - value: '5'
                color: '#9170B8'
      - title: Workload Controllers
        grid: {x: 24, y: 11, w: 24, h: 12}
        lens:
          type: bar
          mode: percentage
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: unique_count(k8s.deployment.name)
              label: Deployments
            - formula: unique_count(k8s.statefulset.name)
              label: StatefulSets
            - formula: unique_count(k8s.daemonset.name)
              label: DaemonSets
            - formula: unique_count(k8s.replicaset.name)
              label: ReplicaSets

      # Section 2: Resource Utilization
      - title: Resource Utilization
        grid: {x: 0, y: 23, w: 48, h: 2}
        markdown:
          content: "## Resource Utilization\nContainer resource requests and limits across the cluster"
          font_size: 12
      - title: CPU Requests vs Limits
        grid: {x: 0, y: 25, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.container.cpu_request)
              label: CPU Requests
            - formula: sum(k8s.container.cpu_limit)
              label: CPU Limits
          filters:
            - exists: k8s.container.name
      - title: Memory Requests vs Limits
        grid: {x: 24, y: 25, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.container.memory_request)
              label: Memory Requests
              format:
                type: bytes
            - formula: sum(k8s.container.memory_limit)
              label: Memory Limits
              format:
                type: bytes
          filters:
            - exists: k8s.container.name
      - title: Storage Requests vs Limits
        grid: {x: 0, y: 35, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.container.storage_request)
              label: Storage Requests
              format:
                type: bytes
            - formula: sum(k8s.container.storage_limit)
              label: Storage Limits
              format:
                type: bytes
          filters:
            - exists: k8s.container.storage_request
      - title: Resource Quota Usage by Resource
        grid: {x: 24, y: 35, w: 24, h: 10}
        lens:
          type: bar
          mode: stacked
          data_view: metrics-*
          dimension:
            field: resource
            type: values
            size: 10
            label: Resource Type
          metrics:
            - field: k8s.resource_quota.used
              aggregation: max
              label: Used
            - formula: max(k8s.resource_quota.hard_limit) - max(k8s.resource_quota.used)
              label: Available
          filters:
            - exists: k8s.resource_quota.hard_limit

      # Section 3: Workload Health
      - title: Workload Health
        grid: {x: 0, y: 45, w: 48, h: 2}
        markdown:
          content: "## Workload Health\nPod status distribution and container health metrics"
          font_size: 12
      - title: Running Pods
        grid: {x: 0, y: 47, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Running
          filters:
            - field: k8s.pod.phase
              equals: '2'
      - title: Pending Pods
        grid: {x: 12, y: 47, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Pending
          filters:
            - field: k8s.pod.phase
              equals: '1'
      - title: Failed Pods
        grid: {x: 24, y: 47, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Failed
          filters:
            - field: k8s.pod.phase
              equals: '4'
      - title: Container Restarts
        grid: {x: 36, y: 47, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.container.restarts)
            label: Total Restarts
          filters:
            - exists: k8s.container.restarts
      - title: Pod Status Over Time
        grid: {x: 0, y: 53, w: 24, h: 10}
        lens:
          type: area
          mode: stacked
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          breakdown:
            field: k8s.pod.phase
            type: values
            size: 5
          metrics:
            - aggregation: count
              label: Pods
          color:
            palette: eui_amsterdam_color_blind
            assignments:
              - value: '1'
                color: '#FEC514'
              - value: '2'
                color: '#54B399'
              - value: '3'
                color: '#6092C0'
              - value: '4'
                color: '#D36086'
              - value: '5'
                color: '#9170B8'
      - title: Container Restart Rate by Namespace
        grid: {x: 24, y: 53, w: 24, h: 10}
        lens:
          type: bar
          mode: stacked
          data_view: metrics-*
          dimension:
            field: k8s.namespace.name
            type: values
            size: 15
            sort:
              by: Restarts
              direction: desc
          metrics:
            - formula: sum(k8s.container.restarts)
              label: Restarts
          filters:
            - exists: k8s.container.restarts

      # Section 4: Deployment Status
      - title: Deployment Status
        grid: {x: 0, y: 63, w: 48, h: 2}
        markdown:
          content: "## Deployment Status\nDeployment, StatefulSet, DaemonSet, and ReplicaSet health"
          font_size: 12
      - title: Deployments - Desired vs Available
        grid: {x: 0, y: 65, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.deployment.desired)
              label: Desired
            - formula: sum(k8s.deployment.available)
              label: Available
          filters:
            - exists: k8s.deployment.name
      - title: StatefulSets - Current vs Ready
        grid: {x: 24, y: 65, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.statefulset.current_pods)
              label: Current
            - formula: sum(k8s.statefulset.ready_pods)
              label: Ready
          filters:
            - exists: k8s.statefulset.name
      - title: DaemonSets - Desired vs Ready Nodes
        grid: {x: 0, y: 75, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.daemonset.desired_scheduled_nodes)
              label: Desired Nodes
            - formula: sum(k8s.daemonset.ready_nodes)
              label: Ready Nodes
            - formula: sum(k8s.daemonset.current_scheduled_nodes)
              label: Current Nodes
          filters:
            - exists: k8s.daemonset.name
      - title: ReplicaSets - Desired vs Available
        grid: {x: 24, y: 75, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.replicaset.desired)
              label: Desired
            - formula: sum(k8s.replicaset.available)
              label: Available
          filters:
            - exists: k8s.replicaset.name
      - title: Deployments by Status
        grid: {x: 0, y: 85, w: 24, h: 10}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - field: k8s.deployment.name
              type: values
              size: 20
              label: Deployment
            - field: k8s.namespace.name
              type: values
              size: 1
              label: Namespace
          metrics:
            - field: k8s.deployment.desired
              aggregation: max
              label: Desired
            - field: k8s.deployment.available
              aggregation: max
              label: Available
          filters:
            - exists: k8s.deployment.name
      - title: StatefulSets by Status
        grid: {x: 24, y: 85, w: 24, h: 10}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - field: k8s.statefulset.name
              type: values
              size: 20
              label: StatefulSet
            - field: k8s.namespace.name
              type: values
              size: 1
              label: Namespace
          metrics:
            - field: k8s.statefulset.desired_pods
              aggregation: max
              label: Desired
            - field: k8s.statefulset.ready_pods
              aggregation: max
              label: Ready
            - field: k8s.statefulset.current_pods
              aggregation: max
              label: Current
          filters:
            - exists: k8s.statefulset.name

      # Section 5: Job & CronJob Status
      - title: Job & CronJob Status
        grid: {x: 0, y: 95, w: 48, h: 2}
        markdown:
          content: "## Job & CronJob Status\nBatch workload execution and completion tracking"
          font_size: 12
      - title: Active Jobs
        grid: {x: 0, y: 97, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.job.active_pods)
            label: Active
          filters:
            - exists: k8s.job.name
      - title: Successful Jobs
        grid: {x: 12, y: 97, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.job.successful_pods)
            label: Successful
          filters:
            - exists: k8s.job.name
      - title: Failed Jobs
        grid: {x: 24, y: 97, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.job.failed_pods)
            label: Failed
          filters:
            - exists: k8s.job.name
      - title: CronJob Active Jobs
        grid: {x: 36, y: 97, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.cronjob.active_jobs)
            label: Active
          filters:
            - exists: k8s.cronjob.name
      - title: Job Completion Trends
        grid: {x: 0, y: 103, w: 24, h: 10}
        lens:
          type: area
          mode: stacked
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.job.successful_pods)
              label: Successful
            - formula: sum(k8s.job.failed_pods)
              label: Failed
            - formula: sum(k8s.job.active_pods)
              label: Active
          filters:
            - exists: k8s.job.name
      - title: Jobs by Status
        grid: {x: 24, y: 103, w: 24, h: 10}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - field: k8s.job.name
              type: values
              size: 20
              label: Job
            - field: k8s.namespace.name
              type: values
              size: 1
              label: Namespace
          metrics:
            - field: k8s.job.active_pods
              aggregation: max
              label: Active
            - field: k8s.job.successful_pods
              aggregation: max
              label: Successful
            - field: k8s.job.failed_pods
              aggregation: max
              label: Failed
            - field: k8s.job.desired_successful_pods
              aggregation: max
              label: Desired
          filters:
            - exists: k8s.job.name

      # Section 6: HPA Monitoring
      - title: HPA Monitoring
        grid: {x: 0, y: 113, w: 48, h: 2}
        markdown:
          content: "## HPA Monitoring\nHorizontal Pod Autoscaler scaling behavior and replica management"
          font_size: 12
      - title: Total HPAs
        grid: {x: 0, y: 115, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: unique_count(k8s.hpa.name)
            label: HPAs
          filters:
            - exists: k8s.hpa.name
      - title: Current Replicas
        grid: {x: 12, y: 115, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.hpa.current_replicas)
            label: Current
          filters:
            - exists: k8s.hpa.name
      - title: Desired Replicas
        grid: {x: 24, y: 115, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.hpa.desired_replicas)
            label: Desired
          filters:
            - exists: k8s.hpa.name
      - title: Max Replicas Limit
        grid: {x: 36, y: 115, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: sum(k8s.hpa.max_replicas)
            label: Total Max
          filters:
            - exists: k8s.hpa.name
      - title: HPA Replica Scaling Over Time
        grid: {x: 0, y: 121, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.hpa.current_replicas)
              label: Current Replicas
            - formula: sum(k8s.hpa.desired_replicas)
              label: Desired Replicas
          filters:
            - exists: k8s.hpa.name
      - title: HPA Capacity Overview
        grid: {x: 24, y: 121, w: 24, h: 10}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - formula: sum(k8s.hpa.min_replicas)
              label: Min Replicas
            - formula: sum(k8s.hpa.current_replicas)
              label: Current Replicas
            - formula: sum(k8s.hpa.max_replicas)
              label: Max Replicas
          filters:
            - exists: k8s.hpa.name
      - title: HPA Details
        grid: {x: 0, y: 131, w: 48, h: 10}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - field: k8s.hpa.name
              type: values
              size: 20
              label: HPA
            - field: k8s.namespace.name
              type: values
              size: 1
              label: Namespace
          metrics:
            - field: k8s.hpa.current_replicas
              aggregation: max
              label: Current
            - field: k8s.hpa.desired_replicas
              aggregation: max
              label: Desired
            - field: k8s.hpa.min_replicas
              aggregation: max
              label: Min
            - field: k8s.hpa.max_replicas
              aggregation: max
              label: Max
          filters:
            - exists: k8s.hpa.name

      # Section 7: Container Analysis
      - title: Container Analysis
        grid: {x: 0, y: 141, w: 48, h: 2}
        markdown:
          content: "## Container Analysis\nContainer readiness, restarts, and resource allocation"
          font_size: 12
      - title: Ready Containers
        grid: {x: 0, y: 143, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Ready
          filters:
            - field: k8s.container.ready
              equals: '1'
      - title: Not Ready Containers
        grid: {x: 12, y: 143, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Not Ready
          filters:
            - field: k8s.container.ready
              equals: '0'
      - title: Total Containers
        grid: {x: 24, y: 143, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Total
          filters:
            - exists: k8s.container.name
      - title: Containers with Restarts
        grid: {x: 36, y: 143, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            formula: count()
            label: Restarted
          filters:
            - field: k8s.container.restarts
              gt: '0'
      - title: Container Readiness Over Time
        grid: {x: 0, y: 149, w: 24, h: 10}
        lens:
          type: area
          mode: stacked
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          breakdown:
            field: k8s.container.ready
            type: values
            size: 2
          metrics:
            - aggregation: count
              label: Containers
          color:
            palette: eui_amsterdam_color_blind
            assignments:
              - value: '1'
                color: '#54B399'
              - value: '0'
                color: '#D36086'
      - title: Top Containers by Restart Count
        grid: {x: 24, y: 149, w: 24, h: 10}
        lens:
          type: bar
          mode: stacked
          data_view: metrics-*
          dimension:
            field: k8s.container.name
            type: values
            size: 15
            sort:
              by: Restarts
              direction: desc
          metrics:
            - field: k8s.container.restarts
              aggregation: max
              label: Restarts
          filters:
            - field: k8s.container.restarts
              gt: '0'
      - title: Container CPU Resources by Namespace
        grid: {x: 0, y: 159, w: 24, h: 10}
        lens:
          type: bar
          mode: stacked
          data_view: metrics-*
          dimension:
            field: k8s.namespace.name
            type: values
            size: 15
            sort:
              by: CPU Limits
              direction: desc
          metrics:
            - formula: sum(k8s.container.cpu_request)
              label: CPU Requests
            - formula: sum(k8s.container.cpu_limit)
              label: CPU Limits
          filters:
            - exists: k8s.container.name
      - title: Container Memory Resources by Namespace
        grid: {x: 24, y: 159, w: 24, h: 10}
        lens:
          type: bar
          mode: stacked
          data_view: metrics-*
          dimension:
            field: k8s.namespace.name
            type: values
            size: 15
            sort:
              by: Memory Limits
              direction: desc
          metrics:
            - formula: sum(k8s.container.memory_request)
              label: Memory Requests
              format:
                type: bytes
            - formula: sum(k8s.container.memory_limit)
              label: Memory Limits
              format:
                type: bytes
          filters:
            - exists: k8s.container.name
      - title: Top Pods by Container Count
        grid: {x: 0, y: 169, w: 24, h: 10}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - field: k8s.pod.name
              type: values
              size: 20
              label: Pod
            - field: k8s.namespace.name
              type: values
              size: 1
              label: Namespace
          metrics:
            - formula: unique_count(k8s.container.name)
              label: Containers
            - formula: sum(k8s.container.restarts)
              label: Total Restarts
          filters:
            - exists: k8s.container.name
      - title: Container Resource Summary by Pod
        grid: {x: 24, y: 169, w: 24, h: 10}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - field: k8s.pod.name
              type: values
              size: 20
              label: Pod
            - field: k8s.namespace.name
              type: values
              size: 1
              label: Namespace
          metrics:
            - formula: sum(k8s.container.cpu_request)
              label: CPU Req
            - formula: sum(k8s.container.cpu_limit)
              label: CPU Lim
            - formula: sum(k8s.container.memory_request)
              label: Mem Req
              format:
                type: bytes
            - formula: sum(k8s.container.memory_limit)
              label: Mem Lim
              format:
                type: bytes
          filters:
            - exists: k8s.container.name
