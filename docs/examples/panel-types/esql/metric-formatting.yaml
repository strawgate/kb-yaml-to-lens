---
dashboards:
  - name: ESQL Metric Formatting Example
    description: Example showing various metric formatting options
    panels:
      - title: Formatted Metrics
        grid: {x: 0, y: 0, w: 48, h: 20}
        esql:
          type: bar
          query: |
            FROM logs-*
            | STATS total_bytes = SUM(bytes),
                    event_count = COUNT(*),
                    avg_response_time = AVG(response.time),
                    success_rate = COUNT(status == 200) / COUNT(*) * 100,
                    precise_value = AVG(bytes) BY timestamp_bucket = BUCKET(@timestamp, 1 hour)
            | ORDER timestamp_bucket ASC
          dimensions:
            - field: timestamp_bucket
          metrics:
            - field: total_bytes
              label: Total Data
              format:
                type: bytes
                decimals: 1
            - field: event_count
              label: Events
              format:
                type: number
                decimals: 0
            - field: avg_response_time
              label: Avg Response Time
              format:
                type: number
                decimals: 2
                suffix: ms
            - field: success_rate
              label: Success Rate
              format:
                type: percent
                decimals: 1
            - field: precise_value
              label: Precise Value
              format:
                type: number
                pattern: 0,0.0000
