---
dashboards:
  - id: elasticsearch-otel-cluster-overview
    name: '[Elasticsearch OTel] Cluster Overview'
    description: Overview of Elasticsearch cluster health and key metrics
    filters:
      - field: data_stream.dataset
        equals: elasticsearchreceiver.otel
    panels:
      - title: Navigation Links
        grid: {x: 0, y: 0, w: 48, h: 2}
        links:
          layout: horizontal
          items:
            - label: Cluster Overview
              dashboard: elasticsearch-otel-cluster-overview
            - label: Node Overview
              dashboard: elasticsearch-otel-node-overview
            - label: Node Metrics
              dashboard: elasticsearch-otel-node-metrics
            - label: Index Metrics
              dashboard: elasticsearch-otel-index-metrics
            - label: JVM Health
              dashboard: elasticsearch-otel-jvm-health
            - label: Circuit Breakers
              dashboard: elasticsearch-otel-circuit-breakers
            - label: Cluster Metadata
              dashboard: elasticsearch-otel-cluster-metadata
      - title: Cluster Health Status
        grid: {x: 0, y: 2, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          breakdown:
            field: status
            label: Health
            size: 3
          primary:
            aggregation: unique_count
            field: elasticsearch.cluster.name
            label: Clusters
      - title: Active Clusters
        grid: {x: 12, y: 2, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            aggregation: unique_count
            field: elasticsearch.cluster.name
            label: Clusters
      - title: Total Nodes
        grid: {x: 24, y: 2, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            aggregation: max
            field: elasticsearch.cluster.nodes
            label: Nodes
      - title: Data Nodes
        grid: {x: 36, y: 2, w: 12, h: 6}
        lens:
          type: metric
          data_view: metrics-*
          primary:
            aggregation: max
            field: elasticsearch.cluster.data_nodes
            label: Data Nodes
      - title: Cluster Health Over Time
        grid: {x: 0, y: 8, w: 48, h: 8}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          breakdown:
            field: elasticsearch.cluster.name
            type: values
            size: 10
          metrics:
            - aggregation: average
              field: elasticsearch.cluster.nodes
              label: Total Nodes
            - aggregation: average
              field: elasticsearch.cluster.data_nodes
              label: Data Nodes
      - title: Shard Distribution
        grid: {x: 0, y: 16, w: 16, h: 8}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - id: cluster
              type: values
              field: elasticsearch.cluster.name
              label: Cluster
              size: 20
          metrics:
            - id: active_primary
              aggregation: max
              field: elasticsearch.cluster.shards.active_primary
              label: Active Primary
            - id: active
              aggregation: max
              field: elasticsearch.cluster.shards.active
              label: Active Shards
            - id: initializing
              aggregation: max
              field: elasticsearch.cluster.shards.initializing
              label: Initializing
            - id: relocating
              aggregation: max
              field: elasticsearch.cluster.shards.relocating
              label: Relocating
            - id: unassigned
              aggregation: max
              field: elasticsearch.cluster.shards.unassigned
              label: Unassigned
      - title: Pending Tasks
        grid: {x: 16, y: 16, w: 16, h: 8}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          breakdown:
            field: elasticsearch.cluster.name
            type: values
            size: 10
          metrics:
            - aggregation: max
              field: elasticsearch.cluster.pending_tasks
              label: Pending Tasks
      - title: In-Flight Fetches
        grid: {x: 32, y: 16, w: 16, h: 8}
        lens:
          type: line
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          breakdown:
            field: elasticsearch.cluster.name
            type: values
            size: 10
          metrics:
            - aggregation: max
              field: elasticsearch.cluster.in_flight_fetch
              label: In-Flight Fetches
      - title: Index Statistics
        grid: {x: 0, y: 24, w: 24, h: 8}
        lens:
          type: datatable
          data_view: metrics-*
          dimensions:
            - id: cluster
              type: values
              field: elasticsearch.cluster.name
              label: Cluster
              size: 20
          metrics:
            - id: indices
              aggregation: average
              field: elasticsearch.cluster.indices
              label: Indices
            - id: state_queue
              aggregation: average
              field: elasticsearch.cluster.state_queue
              label: State Queue
      - title: Shards Over Time
        grid: {x: 24, y: 24, w: 24, h: 8}
        lens:
          type: area
          mode: stacked
          data_view: metrics-*
          dimension:
            field: '@timestamp'
            type: date_histogram
          metrics:
            - aggregation: max
              field: elasticsearch.cluster.shards.active_primary
              label: Active Primary
            - aggregation: max
              field: elasticsearch.cluster.shards.active
              label: Active
            - aggregation: max
              field: elasticsearch.cluster.shards.initializing
              label: Initializing
            - aggregation: max
              field: elasticsearch.cluster.shards.relocating
              label: Relocating
            - aggregation: max
              field: elasticsearch.cluster.shards.unassigned
              label: Unassigned
