#
# Dashboard for Apache HTTP Server metrics collected via OpenTelemetry apachereceiver.
# Uses ES|QL with TS command for time-series optimization.
# Source: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/apachereceiver
dashboards:
  - id: otel-apache-overview
    name: '[OTel] Apache HTTP Server - Overview'
    description: Overview of Apache HTTP Server metrics from OpenTelemetry apachereceiver
    controls:
      - type: options
        label: Server Address
        data_view: metrics-*
        field: server.address
      - type: options
        label: Server Port
        data_view: metrics-*
        field: server.port
    filters:
      - field: data_stream.dataset
        equals: apachereceiver.otel
    panels:
      - size: {w: 48, h: 2}
        position: {x: 0, y: 0}
        markdown:
          content: |
            **Note:** This dashboard uses ES|QL queries with the `TS` (time series) command for optimized time series analysis.
            The `TS` command provides native rate calculations via `RATE()` and efficient time bucketing via `TBUCKET()`.
          font_size: 12

      # Overview Metrics Row
      - title: Total Requests
        size: {w: 12, h: 6}
        position: {x: 0, y: 2}
        esql:
          type: metric
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.requests IS NOT NULL
            - STATS requests_rate = SUM(RATE(apache.requests))
          primary:
            field: requests_rate
            label: Requests/sec
            format:
              type: number
      - title: Total Traffic
        size: {w: 12, h: 6}
        position: {x: 12, y: 2}
        esql:
          type: metric
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.traffic IS NOT NULL
            - STATS traffic_rate = SUM(RATE(apache.traffic))
          primary:
            field: traffic_rate
            label: Traffic/sec
            format:
              type: bytes
      - title: Active Connections
        size: {w: 12, h: 6}
        position: {x: 24, y: 2}
        esql:
          type: metric
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.current_connections IS NOT NULL
            - STATS connections = MAX(apache.current_connections)
          primary:
            field: connections
            label: Connections
            format:
              type: number
              pattern: 0,0
      - title: Server Uptime
        size: {w: 12, h: 6}
        position: {x: 36, y: 2}
        esql:
          type: metric
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.uptime IS NOT NULL
            - STATS uptime = MAX(apache.uptime)
          primary:
            field: uptime
            label: Uptime
            format:
              type: duration
      - title: CPU Load (Current)
        size: {w: 12, h: 6}
        position: {x: 0, y: 8}
        esql:
          type: metric
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.cpu.load IS NOT NULL
            - STATS cpu_load = AVG(apache.cpu.load)
          primary:
            field: cpu_load
            label: CPU Load
            format:
              type: percent

      # Time Series Charts
      - title: Request Rate Over Time
        size: {w: 24, h: 10}
        position: {x: 12, y: 8}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.requests IS NOT NULL
            - STATS requests_rate = SUM(RATE(apache.requests)) BY time_bucket = TBUCKET(1 minute), server.address
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: requests_rate
              label: Requests/sec
              format:
                type: number
          breakdown:
            field: server.address
      - title: Traffic Rate Over Time
        size: {w: 12, h: 10}
        position: {x: 36, y: 8}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.traffic IS NOT NULL
            - STATS traffic_rate = SUM(RATE(apache.traffic)) BY time_bucket = TBUCKET(1 minute), server.address
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: traffic_rate
              label: Traffic/sec
              format:
                type: bytes
          breakdown:
            field: server.address
      - title: CPU Time Rate
        size: {w: 24, h: 10}
        position: {x: 0, y: 18}
        esql:
          type: area
          mode: stacked
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.cpu.time IS NOT NULL
            - STATS cpu_time_rate = SUM(RATE(apache.cpu.time)) BY time_bucket = TBUCKET(1 minute), server.address
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: cpu_time_rate
              label: CPU Time/sec
              format:
                type: duration
          breakdown:
            field: server.address
      - title: Request Processing Time Rate
        size: {w: 24, h: 10}
        position: {x: 24, y: 18}
        esql:
          type: area
          mode: stacked
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.request.time IS NOT NULL
            - STATS request_time_rate = SUM(RATE(apache.request.time)) BY time_bucket = TBUCKET(1 minute), server.address
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: request_time_rate
              label: Request Time/sec
              format:
                type: duration
          breakdown:
            field: server.address

      # Server Load and Metrics
      - title: Server Load Average
        size: {w: 16, h: 10}
        position: {x: 0, y: 28}
        esql:
          type: line
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.load.1 IS NOT NULL
            - STATS load_1m = AVG(apache.load.1), load_5m = AVG(apache.load.5), load_15m = AVG(apache.load.15) BY time_bucket = BUCKET(@timestamp,
              50, DATE_TRUNC(1 minute, MIN(@timestamp)), DATE_TRUNC(1 minute, MAX(@timestamp) + 1 minute)), server.address
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: load_1m
              label: 1-min Load
              format:
                type: percent
            - field: load_5m
              label: 5-min Load
              format:
                type: percent
            - field: load_15m
              label: 15-min Load
              format:
                type: percent
          breakdown:
            field: server.address
      - title: Connection Metrics
        size: {w: 16, h: 10}
        position: {x: 16, y: 28}
        esql:
          type: line
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.current_connections IS NOT NULL
            - STATS connections = AVG(apache.current_connections) BY time_bucket = BUCKET(@timestamp, 50, DATE_TRUNC(1 minute, MIN(@timestamp)),
              DATE_TRUNC(1 minute, MAX(@timestamp) + 1 minute)), server.address
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: connections
              label: Current Connections
              format:
                type: number
                pattern: 0,0
          breakdown:
            field: server.address
      - title: Uptime by Server
        size: {w: 16, h: 10}
        position: {x: 32, y: 28}
        esql:
          type: line
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.uptime IS NOT NULL
            - STATS uptime = MAX(apache.uptime) BY time_bucket = BUCKET(@timestamp, 50, DATE_TRUNC(1 minute, MIN(@timestamp)), DATE_TRUNC(1 minute,
              MAX(@timestamp) + 1 minute)), server.address
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: uptime
              label: Uptime
              format:
                type: duration
          breakdown:
            field: server.address

      # Async Connections and Workers
      - title: Async Connections by State
        size: {w: 24, h: 12}
        position: {x: 0, y: 38}
        esql:
          type: area
          mode: stacked
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.connections.async IS NOT NULL
            - STATS connections = AVG(apache.connections.async) BY time_bucket = BUCKET(@timestamp, 50, DATE_TRUNC(1 minute, MIN(@timestamp)),
              DATE_TRUNC(1 minute, MAX(@timestamp) + 1 minute)), attributes.connection_state
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: connections
              label: Async Connections
              format:
                type: number
                pattern: 0,0
          breakdown:
            field: attributes.connection_state
      - title: Worker Distribution
        size: {w: 24, h: 12}
        position: {x: 24, y: 38}
        esql:
          type: pie
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.workers IS NOT NULL
            - STATS workers = AVG(apache.workers) BY state = attributes.workers_state
            - SORT workers DESC
            - LIMIT 10
          metrics:
            - field: workers
              label: Workers
              format:
                type: number
                pattern: 0,0
          dimensions:
            - field: state
          appearance:
            donut: medium

      # Scoreboard and Workers Over Time
      - title: Scoreboard Status
        size: {w: 48, h: 12}
        position: {x: 0, y: 50}
        esql:
          type: bar
          mode: stacked
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.scoreboard IS NOT NULL
            - STATS scoreboard = AVG(apache.scoreboard) BY time_bucket = BUCKET(@timestamp, 50, DATE_TRUNC(1 minute, MIN(@timestamp)), DATE_TRUNC(1
              minute, MAX(@timestamp) + 1 minute)), attributes.scoreboard_state
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: scoreboard
              label: Scoreboard
              format:
                type: number
                pattern: 0,0
          breakdown:
            field: attributes.scoreboard_state
      - title: Workers by State Over Time
        size: {w: 48, h: 12}
        position: {x: 0, y: 62}
        esql:
          type: area
          mode: stacked
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE apache.workers IS NOT NULL
            - STATS workers = AVG(apache.workers) BY time_bucket = BUCKET(@timestamp, 50, DATE_TRUNC(1 minute, MIN(@timestamp)), DATE_TRUNC(1
              minute, MAX(@timestamp) + 1 minute)), attributes.workers_state
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: workers
              label: Workers
              format:
                type: number
                pattern: 0,0
          breakdown:
            field: attributes.workers_state

      # Server Performance Summary
      - title: Server Performance Summary
        size: {w: 48, h: 20}
        position: {x: 0, y: 74}
        description: Shows performance metrics per server. Request and traffic rates are derived from cumulative counters.
        esql:
          type: datatable
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "apachereceiver.otel"
            - WHERE server.address IS NOT NULL
            - STATS requests_total = MAX(apache.requests), traffic_total = MAX(apache.traffic), connections = ROUND(MAX(apache.current_connections),
              0), cpu_load = AVG(apache.load.1), uptime = MAX(apache.uptime) BY server_addr = server.address, server_port = server.port
            - KEEP server_addr, server_port, requests_total, traffic_total, connections, cpu_load, uptime
            - SORT server_addr ASC
            - LIMIT 100
          dimensions:
            - field: server_addr
            - field: server_port
            - field: requests_total
            - field: traffic_total
            - field: connections
            - field: cpu_load
            - field: uptime
