---
# Aerospike Node Metrics Dashboard (ES|QL)
# Provides detailed per-node performance monitoring
# Uses ES|QL with TS command for time-series optimization
dashboards:
  - id: 36bd5b4a-9c5b-4377-827d-f2e64d860f60
    name: '[Metrics Aerospike] Node Metrics'
    description: Detailed per-node performance monitoring for Aerospike using ES|QL
    filters:
      - field: data_stream.dataset
        equals: aerospikereceiver.otel
    controls:
      - type: options
        id: aerospike-node-filter
        label: Aerospike Node
        width: medium
        data_view: metrics-*
        field: aerospike.node.name
        match_technique: contains
    panels:
      # Navigation Links
      - size: {w: 48, h: 2}
        position: {x: 0, y: 0}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: 4d5b8a67-c5d9-478c-8128-e09cccc7f8ef
            - label: Node Metrics
              dashboard: 36bd5b4a-9c5b-4377-827d-f2e64d860f60
            - label: Namespace Metrics
              dashboard: c9484395-aa2b-43c4-84ad-12a7feb8c7d1

      # Context Note
      - size: {w: 48, h: 2}
        position: {x: 0, y: 2}
        markdown:
          content: |
            This dashboard is intended to be used with a single Aerospike node. Filter to a specific node before using this dashboard.

      # KPI Metrics Row
      - title: Selected Nodes
        size: {w: 8, h: 5}
        position: {x: 0, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.name IS NOT NULL
            | STATS node_count = COUNT_DISTINCT(aerospike.node.name)
          primary:
            field: node_count
            label: Nodes
      - title: Aerospike Namespaces
        size: {w: 8, h: 5}
        position: {x: 8, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace IS NOT NULL
            | STATS namespace_count = COUNT_DISTINCT(aerospike.namespace)
          primary:
            field: namespace_count
            label: Namespaces
      - title: Memory Free
        size: {w: 8, h: 5}
        position: {x: 16, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.memory.free IS NOT NULL
            | STATS memory_free = MAX(aerospike.node.memory.free)
          primary:
            field: memory_free
            label: Memory Free
            format:
              type: bytes
      - title: Memory Used
        size: {w: 8, h: 5}
        position: {x: 24, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.memory.used IS NOT NULL
            | STATS memory_used = MAX(aerospike.node.memory.used)
          primary:
            field: memory_used
            label: Memory Used
            format:
              type: bytes
      - title: Open Connections
        size: {w: 8, h: 5}
        position: {x: 32, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.connection.open IS NOT NULL
            | STATS connections = MAX(aerospike.node.connection.open)
          primary:
            field: connections
            label: Connections
      - title: Connection Count
        size: {w: 8, h: 5}
        position: {x: 40, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.connection.count IS NOT NULL
            | STATS connection_count = MAX(aerospike.node.connection.count)
          primary:
            field: connection_count
            label: Connection Count

      # Memory Section Header
      - size: {w: 48, h: 2}
        position: {x: 0, y: 9}
        markdown:
          content: '## Memory Metrics'

      # Memory Charts
      - title: Memory Free Over Time
        size: {w: 24, h: 10}
        position: {x: 0, y: 11}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.memory.free IS NOT NULL
            | STATS memory_free = MAX(AVG_OVER_TIME(aerospike.node.memory.free)) BY time_bucket = TBUCKET(1 minute), node = aerospike.node.name
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: memory_free
              label: Memory Free
              format:
                type: bytes
          breakdown:
            field: node
      - title: Memory Used Over Time
        size: {w: 24, h: 10}
        position: {x: 24, y: 11}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.memory.used IS NOT NULL
            | STATS memory_used = MAX(AVG_OVER_TIME(aerospike.node.memory.used)) BY time_bucket = TBUCKET(1 minute), node = aerospike.node.name
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: memory_used
              label: Memory Used
              format:
                type: bytes
          breakdown:
            field: node

      # Connection Section Header
      - size: {w: 48, h: 2}
        position: {x: 0, y: 21}
        markdown:
          content: '## Connection Metrics'

      # Connection Charts
      - title: Open Connections Over Time
        size: {w: 24, h: 10}
        position: {x: 0, y: 23}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.connection.open IS NOT NULL
            | STATS connections = MAX(AVG_OVER_TIME(aerospike.node.connection.open)) BY time_bucket = TBUCKET(1 minute), node = aerospike.node.name
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: connections
              label: Open Connections
          breakdown:
            field: node
      - title: Connection Count Over Time
        size: {w: 24, h: 10}
        position: {x: 24, y: 23}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.connection.count IS NOT NULL
            | STATS connection_count = MAX(AVG_OVER_TIME(aerospike.node.connection.count)) BY time_bucket = TBUCKET(1 minute), node = aerospike.node.name
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: connection_count
              label: Connection Count
          breakdown:
            field: node

      # Connections by Type
      - title: Connections by Type
        size: {w: 48, h: 10}
        position: {x: 0, y: 33}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.connection.open IS NOT NULL
            | STATS connections = MAX(AVG_OVER_TIME(aerospike.node.connection.open)) BY time_bucket = TBUCKET(1 minute), connection_type = attributes.type
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: connections
              label: Connections
          breakdown:
            field: connection_type

      # Node Details Table
      - title: Node Details
        size: {w: 48, h: 12}
        position: {x: 0, y: 43}
        description: Detailed node-level metrics
        esql:
          type: datatable
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "aerospikereceiver.otel"
            - WHERE aerospike.node.name IS NOT NULL
            - STATS memory_free = MAX(aerospike.node.memory.free), memory_used = MAX(aerospike.node.memory.used), connections_open = MAX(aerospike.node.connection.open),
              connections_count = MAX(aerospike.node.connection.count) BY node = aerospike.node.name
            - KEEP node, memory_free, memory_used, connections_open, connections_count
            - SORT node ASC
            - LIMIT 100
          dimensions:
            - field: node
            - field: memory_free
            - field: memory_used
            - field: connections_open
            - field: connections_count
