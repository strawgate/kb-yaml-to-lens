---
# Aerospike Namespace Metrics Dashboard (ES|QL)
# Provides namespace-level storage and query statistics
# Uses ES|QL with TS command for time-series optimization
dashboards:
  - id: c9484395-aa2b-43c4-84ad-12a7feb8c7d1
    name: '[Metrics Aerospike] Namespace Metrics'
    description: Namespace-level storage and query statistics for Aerospike using ES|QL
    filters:
      - field: data_stream.dataset
        equals: aerospikereceiver.otel
    controls:
      - type: options
        id: aerospike-node-ns-filter
        label: Aerospike Node
        width: medium
        data_view: metrics-*
        field: aerospike.node.name
        match_technique: contains
      - type: options
        id: aerospike-namespace-filter
        label: Aerospike Namespace
        width: medium
        data_view: metrics-*
        field: aerospike.namespace
        match_technique: prefix
    panels:
      # Navigation Links
      - size: {w: 48, h: 2}
        position: {x: 0, y: 0}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: 4d5b8a67-c5d9-478c-8128-e09cccc7f8ef
            - label: Node Metrics
              dashboard: 36bd5b4a-9c5b-4377-827d-f2e64d860f60
            - label: Namespace Metrics
              dashboard: c9484395-aa2b-43c4-84ad-12a7feb8c7d1

      # Context Note
      - size: {w: 48, h: 2}
        position: {x: 0, y: 2}
        markdown:
          content: |
            This dashboard is intended to be used with a single Aerospike node and a single Aerospike namespace.
            Filter to a specific node and namespace before using this dashboard.

      # KPI Metrics Row
      - title: Selected Namespaces
        size: {w: 12, h: 5}
        position: {x: 0, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace IS NOT NULL
            | STATS namespace_count = COUNT_DISTINCT(aerospike.namespace)
          primary:
            field: namespace_count
            label: Namespaces
      - title: Total Objects
        size: {w: 12, h: 5}
        position: {x: 12, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace.memory.usage IS NOT NULL
            | STATS total_objects = MAX(aerospike.namespace.memory.usage)
          primary:
            field: total_objects
            label: Objects
      - title: Disk Usage
        size: {w: 12, h: 5}
        position: {x: 24, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace.disk.available IS NOT NULL
            | STATS disk_available = MAX(aerospike.namespace.disk.available)
          primary:
            field: disk_available
            label: Disk Available
            format:
              type: bytes
      - title: Memory Usage
        size: {w: 12, h: 5}
        position: {x: 36, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace.memory.free IS NOT NULL
            | STATS memory_free = MAX(aerospike.namespace.memory.free)
          primary:
            field: memory_free
            label: Memory Free
            format:
              type: bytes

      # Query Information Section
      - size: {w: 48, h: 2}
        position: {x: 0, y: 9}
        markdown:
          content: '## Query Information'

      # Query Charts - Primary Index
      - title: Primary Index Queries Over Time
        size: {w: 24, h: 10}
        position: {x: 0, y: 11}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace.query.count IS NOT NULL
            | WHERE attributes.index == "primary"
            | STATS query_rate = SUM(RATE(aerospike.namespace.query.count)) BY time_bucket = TBUCKET(1 minute), namespace = aerospike.namespace
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: query_rate
              label: Queries/sec
              format:
                type: number
                decimals: 2
          breakdown:
            field: namespace

      # Query Charts - Secondary Index
      - title: Secondary Index Queries Over Time
        size: {w: 24, h: 10}
        position: {x: 24, y: 11}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace.query.count IS NOT NULL
            | WHERE attributes.index == "secondary"
            | STATS query_rate = SUM(RATE(aerospike.namespace.query.count)) BY time_bucket = TBUCKET(1 minute), namespace = aerospike.namespace
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: query_rate
              label: Queries/sec
              format:
                type: number
                decimals: 2
          breakdown:
            field: namespace

      # Transaction Information Section
      - size: {w: 48, h: 2}
        position: {x: 0, y: 21}
        markdown:
          content: '## Transaction Information'

      # Transaction Charts
      - title: Transaction Rate Over Time
        size: {w: 48, h: 10}
        position: {x: 0, y: 23}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace.transaction.count IS NOT NULL
            | STATS transaction_rate = SUM(RATE(aerospike.namespace.transaction.count)) BY time_bucket = TBUCKET(1 minute), transaction_type = attributes.type
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: transaction_rate
              label: Transactions/sec
              format:
                type: number
                decimals: 2
          breakdown:
            field: transaction_type

      # Storage Metrics Section
      - size: {w: 48, h: 2}
        position: {x: 0, y: 33}
        markdown:
          content: '## Storage Metrics'

      # Storage Charts
      - title: Memory Usage Over Time
        size: {w: 24, h: 10}
        position: {x: 0, y: 35}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace.memory.usage IS NOT NULL
            | STATS memory_usage = MAX(AVG_OVER_TIME(aerospike.namespace.memory.usage)) BY time_bucket = TBUCKET(1 minute), namespace = aerospike.namespace
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: memory_usage
              label: Memory Usage
              format:
                type: bytes
          breakdown:
            field: namespace
      - title: Disk Usage Over Time
        size: {w: 24, h: 10}
        position: {x: 24, y: 35}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace.disk.available IS NOT NULL
            | STATS disk_available = MAX(AVG_OVER_TIME(aerospike.namespace.disk.available)) BY time_bucket = TBUCKET(1 minute), namespace = aerospike.namespace
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: disk_available
              label: Disk Available
              format:
                type: bytes
          breakdown:
            field: namespace

      # Distribution Charts
      - title: Memory Usage by Namespace
        size: {w: 24, h: 10}
        position: {x: 0, y: 45}
        esql:
          type: pie
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace.memory.usage IS NOT NULL
            | STATS memory_usage = MAX(aerospike.namespace.memory.usage) BY namespace = aerospike.namespace
            | SORT memory_usage DESC
            | LIMIT 20
          metrics:
            - field: memory_usage
              label: Memory Usage
              format:
                type: bytes
          dimensions:
            - field: namespace
          appearance:
            donut: medium
      - title: Disk Available by Namespace
        size: {w: 24, h: 10}
        position: {x: 24, y: 45}
        esql:
          type: pie
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace.disk.available IS NOT NULL
            | STATS disk_available = MAX(aerospike.namespace.disk.available) BY namespace = aerospike.namespace
            | SORT disk_available DESC
            | LIMIT 20
          metrics:
            - field: disk_available
              label: Disk Available
              format:
                type: bytes
          dimensions:
            - field: namespace
          appearance:
            donut: medium

      # Namespace Summary Table
      - title: Namespace Summary
        size: {w: 48, h: 12}
        position: {x: 0, y: 55}
        description: Summary of namespace-level metrics
        esql:
          type: datatable
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "aerospikereceiver.otel"
            - WHERE aerospike.namespace IS NOT NULL
            - STATS memory_usage = MAX(aerospike.namespace.memory.usage), memory_free = MAX(aerospike.namespace.memory.free), disk_available =
              MAX(aerospike.namespace.disk.available), query_count = MAX(aerospike.namespace.query.count), transaction_count = MAX(aerospike.namespace.transaction.count)
              BY namespace = aerospike.namespace, node = aerospike.node.name
            - KEEP namespace, node, memory_usage, memory_free, disk_available, query_count, transaction_count
            - SORT namespace ASC, node ASC
            - LIMIT 100
          dimensions:
            - field: namespace
            - field: node
            - field: memory_usage
            - field: memory_free
            - field: disk_available
            - field: query_count
            - field: transaction_count
