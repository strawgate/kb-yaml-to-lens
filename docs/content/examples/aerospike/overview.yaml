---
# Aerospike Overview Dashboard (ES|QL)
# Provides cluster-level metrics and node health monitoring
# Uses ES|QL with TS command for time-series optimization
dashboards:
  - id: 4d5b8a67-c5d9-478c-8128-e09cccc7f8ef
    name: '[Metrics Aerospike] Overview'
    description: Aerospike cluster overview with node health and performance metrics using ES|QL
    filters:
      - field: data_stream.dataset
        equals: aerospikereceiver.otel
    controls:
      - type: options
        id: node-filter
        label: Node
        width: medium
        data_view: metrics-*
        field: aerospike.node.name
      - type: options
        id: namespace-filter
        label: Namespace
        width: medium
        data_view: metrics-*
        field: aerospike.namespace
    panels:
      # Navigation Links
      - size: {w: 48, h: 2}
        position: {x: 0, y: 0}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: 4d5b8a67-c5d9-478c-8128-e09cccc7f8ef
            - label: Node Metrics
              dashboard: 36bd5b4a-9c5b-4377-827d-f2e64d860f60
            - label: Namespace Metrics
              dashboard: c9484395-aa2b-43c4-84ad-12a7feb8c7d1

      # ES|QL Note
      - size: {w: 48, h: 2}
        position: {x: 0, y: 2}
        markdown:
          content: |
            **Note:** This dashboard uses ES|QL queries with the `TS` (time series) command for optimized time series analysis.
            The `TS` command provides native rate calculations via `RATE()` and efficient time bucketing via `TBUCKET()`.
          font_size: 12

      # KPI Metrics Row
      - title: Aerospike Nodes
        size: {w: 12, h: 5}
        position: {x: 0, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.name IS NOT NULL
            | STATS node_count = COUNT_DISTINCT(aerospike.node.name)
          primary:
            field: node_count
            label: Nodes
      - title: Unique Namespaces
        size: {w: 12, h: 5}
        position: {x: 12, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.namespace IS NOT NULL
            | STATS namespace_count = COUNT_DISTINCT(aerospike.namespace)
          primary:
            field: namespace_count
            label: Namespaces
      - title: Total Connections
        size: {w: 12, h: 5}
        position: {x: 24, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.connection.open IS NOT NULL
            | STATS total_connections = MAX(aerospike.node.connection.open)
          primary:
            field: total_connections
            label: Connections
      - title: Avg Memory Free
        size: {w: 12, h: 5}
        position: {x: 36, y: 4}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.memory.free IS NOT NULL
            | STATS memory_free = AVG(aerospike.node.memory.free)
          primary:
            field: memory_free
            label: Memory Free
            format:
              type: percent

      # Cluster Summary DataTable
      - title: Cluster Node Summary
        size: {w: 48, h: 15}
        position: {x: 0, y: 9}
        description: Summary of node-level metrics across the cluster
        esql:
          type: datatable
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "aerospikereceiver.otel"
            - WHERE aerospike.node.name IS NOT NULL
            - STATS memory_free = AVG(aerospike.node.memory.free), connections = SUM(aerospike.node.connection.open), namespaces = COUNT_DISTINCT(aerospike.namespace)
              BY node = aerospike.node.name
            - KEEP node, namespaces, memory_free, connections
            - SORT node ASC
            - LIMIT 100
          dimensions:
            - field: node
            - field: namespaces
            - field: memory_free
            - field: connections

      # Memory Usage Over Time
      - title: Memory Free Over Time
        size: {w: 48, h: 10}
        position: {x: 0, y: 24}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.memory.free IS NOT NULL
            | STATS memory_free = AVG(AVG_OVER_TIME(aerospike.node.memory.free)) BY time_bucket = TBUCKET(1 minute), node = aerospike.node.name
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: memory_free
              label: Memory Free %
              format:
                type: percent
          breakdown:
            field: node

      # Connections Over Time
      - title: Open Connections Over Time
        size: {w: 48, h: 10}
        position: {x: 0, y: 34}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.connection.open IS NOT NULL
            | STATS connections = SUM(AVG_OVER_TIME(aerospike.node.connection.open)) BY time_bucket = TBUCKET(1 minute), node = aerospike.node.name
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: connections
              label: Open Connections
          breakdown:
            field: node

      # Distribution Charts
      - title: Memory Free by Node
        size: {w: 24, h: 10}
        position: {x: 0, y: 44}
        esql:
          type: pie
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.memory.free IS NOT NULL
            | STATS memory_free = AVG(aerospike.node.memory.free) BY node = aerospike.node.name
            | SORT memory_free DESC
            | LIMIT 20
          metrics:
            - field: memory_free
              label: Memory Free %
              format:
                type: percent
          dimensions:
            - field: node
          appearance:
            donut: medium
      - title: Connections by Node
        size: {w: 24, h: 10}
        position: {x: 24, y: 44}
        esql:
          type: pie
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "aerospikereceiver.otel"
            | WHERE aerospike.node.connection.open IS NOT NULL
            | STATS connections = SUM(aerospike.node.connection.open) BY node = aerospike.node.name
            | SORT connections DESC
            | LIMIT 20
          metrics:
            - field: connections
              label: Connections
          dimensions:
            - field: node
          appearance:
            donut: medium
