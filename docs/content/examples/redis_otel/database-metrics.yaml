---
# Redis OpenTelemetry Database Metrics Dashboard (ES|QL Version)
# Per-database keyspace metrics
#
# Metrics reference: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/redisreceiver
dashboards:
  - id: redis-database-metrics
    name: '[Metrics Redis] Database Metrics'
    description: OpenTelemetry Redis Receiver - Per-database keyspace metrics (ES|QL)
    filters:
      - field: data_stream.dataset
        equals: redisreceiver.otel
    controls:
      - type: options
        id: instance-filter
        label: Redis Instance
        data_view: metrics-*
        field: resource.attributes.service.instance.id
        width: medium
    panels:
      # Navigation Links
      - size: {w: 48, h: 2}
        position: {x: 0, y: 0}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: redis-overview
            - label: Instance Details
              dashboard: redis-instance-details
            - label: Database Metrics
              dashboard: redis-database-metrics
            - label: Redis Documentation
              url: https://redis.io/docs/

      # Section Header
      - position: {x: 0, y: 2}
        size: {w: 48, h: 2}
        markdown:
          content: '## Database Overview'
          font_size: 14

      # KPI Row
      - title: Total Databases
        position: {x: 0, y: 4}
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE attributes.db IS NOT NULL
            | STATS databases = COUNT_DISTINCT(attributes.db)
          primary:
            field: databases
            label: Databases
      - title: Total Keys
        position: {x: 12, y: 4}
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.db.keys IS NOT NULL
            | STATS keys = SUM(redis.db.keys)
          primary:
            field: keys
            label: Keys
      - title: Total Keys with Expiry
        position: {x: 24, y: 4}
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.db.expires IS NOT NULL
            | STATS expires = SUM(redis.db.expires)
          primary:
            field: expires
            label: Keys w/ TTL
      - title: Avg TTL (All DBs)
        position: {x: 36, y: 4}
        size: {w: 12, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.db.avg_ttl IS NOT NULL
            | STATS avg_ttl = AVG(redis.db.avg_ttl)
          primary:
            field: avg_ttl
            label: Avg TTL (ms)

      # Section Header
      - position: {x: 0, y: 9}
        size: {w: 48, h: 2}
        markdown:
          content: '## Keys by Database'
          font_size: 14

      # Key Count by Database (Bar Chart)
      - title: Key Count by Database
        position: {x: 0, y: 11}
        size: {w: 24, h: 12}
        esql:
          type: bar
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.db.keys IS NOT NULL
            | STATS keys = AVG(redis.db.keys) BY db = attributes.db
            | SORT keys DESC
            | LIMIT 16
          legend:
            visible: show
            position: right
          dimension:
            field: db
          metrics:
            - field: keys
              label: Keys

      # Keys Distribution (Pie Chart)
      - title: Keys Distribution (Pie)
        position: {x: 24, y: 11}
        size: {w: 24, h: 12}
        esql:
          type: pie
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.db.keys IS NOT NULL
            | STATS keys = AVG(redis.db.keys) BY db = attributes.db
            | SORT keys DESC
            | LIMIT 16
          metrics:
            - field: keys
              label: Keys
          dimensions:
            - field: db
          appearance:
            donut: medium

      # Key Count Trend by Database (Gauge - use AVG_OVER_TIME)
      - title: Key Count Trend by Database
        position: {x: 0, y: 23}
        size: {w: 48, h: 12}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.db.keys IS NOT NULL
            | STATS keys = MAX(AVG_OVER_TIME(redis.db.keys))
              BY time_bucket = TBUCKET(1 minute), db = attributes.db
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: keys
              label: Keys
          breakdown:
            field: db

      # Section Header
      - position: {x: 0, y: 35}
        size: {w: 48, h: 2}
        markdown:
          content: '## Keys with Expiration'
          font_size: 14

      # Keys with TTL by Database (Bar Chart)
      - title: Keys with TTL by Database
        position: {x: 0, y: 37}
        size: {w: 24, h: 12}
        esql:
          type: bar
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.db.expires IS NOT NULL
            | STATS expires = AVG(redis.db.expires) BY db = attributes.db
            | SORT expires DESC
            | LIMIT 16
          legend:
            visible: show
            position: right
          dimension:
            field: db
          metrics:
            - field: expires
              label: Expires

      # Keys with TTL Trend (Gauge - use AVG_OVER_TIME)
      - title: Keys with TTL Trend
        position: {x: 24, y: 37}
        size: {w: 24, h: 12}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.db.expires IS NOT NULL
            | STATS expires = MAX(AVG_OVER_TIME(redis.db.expires))
              BY time_bucket = TBUCKET(1 minute), db = attributes.db
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: expires
              label: Expires
          breakdown:
            field: db

      # Section Header
      - position: {x: 0, y: 49}
        size: {w: 48, h: 2}
        markdown:
          content: '## Average Time-To-Live (TTL)'
          font_size: 14

      # Average TTL by Database (Bar Chart)
      - title: Average TTL by Database
        position: {x: 0, y: 51}
        size: {w: 24, h: 12}
        esql:
          type: bar
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.db.avg_ttl IS NOT NULL
            | STATS avg_ttl = AVG(redis.db.avg_ttl) BY db = attributes.db
            | SORT avg_ttl DESC
            | LIMIT 16
          legend:
            visible: show
            position: right
          dimension:
            field: db
          metrics:
            - field: avg_ttl
              label: Avg TTL

      # Average TTL Trend by Database (Gauge - use AVG_OVER_TIME)
      - title: Average TTL Trend by Database
        position: {x: 24, y: 51}
        size: {w: 24, h: 12}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.db.avg_ttl IS NOT NULL
            | STATS avg_ttl = MAX(AVG_OVER_TIME(redis.db.avg_ttl))
              BY time_bucket = TBUCKET(1 minute), db = attributes.db
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: avg_ttl
              label: Avg TTL
          breakdown:
            field: db

      # Section Header
      - position: {x: 0, y: 63}
        size: {w: 48, h: 2}
        markdown:
          content: '## Database Summary Table'
          font_size: 14

      # Database Metrics Summary Table
      - title: Database Metrics Summary
        position: {x: 0, y: 65}
        size: {w: 48, h: 20}
        esql:
          type: datatable
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "redisreceiver.otel"
            - WHERE attributes.db IS NOT NULL
            - STATS keys = AVG(redis.db.keys), expires = AVG(redis.db.expires), avg_ttl = AVG(redis.db.avg_ttl) BY db = attributes.db
            - EVAL expire_pct = expires / (keys + 0.000001)
            - KEEP db, keys, expires, expire_pct, avg_ttl
            - SORT keys DESC
            - LIMIT 100
          dimensions:
            - field: db
            - field: keys
            - field: expires
            - field: expire_pct
            - field: avg_ttl
