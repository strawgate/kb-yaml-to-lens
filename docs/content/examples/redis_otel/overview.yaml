---
# Redis OpenTelemetry Overview Dashboard (ES|QL Version)
# Provides cluster-level metrics and instance health monitoring
#
# Metrics reference: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/redisreceiver
dashboards:
  - id: redis-overview
    name: '[Metrics Redis] Overview'
    description: OpenTelemetry Redis Receiver - Overview dashboard showing key metrics across all Redis instances (ES|QL)
    filters:
      - field: data_stream.dataset
        equals: redisreceiver.otel
    controls:
      - type: options
        id: instance-filter
        label: Instance
        width: medium
        data_view: metrics-*
        field: resource.attributes.service.instance.id
    panels:
      # Navigation Links
      - size: {w: 48, h: 2}
        position: {x: 0, y: 0}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: redis-overview
            - label: Instance Details
              dashboard: redis-instance-details
            - label: Database Metrics
              dashboard: redis-database-metrics
            - label: Redis Documentation
              url: https://redis.io/docs/

      # Section Header
      - position: {x: 0, y: 2}
        size: {w: 48, h: 2}
        markdown:
          content: '## Redis Instance Overview'
          font_size: 14

      # KPI Metrics Row
      - title: Total Redis Instances
        position: {x: 0, y: 4}
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE resource.attributes.service.instance.id IS NOT NULL
            | STATS instances = COUNT_DISTINCT(resource.attributes.service.instance.id)
          primary:
            field: instances
            label: Instances
      - title: Total Client Connections
        position: {x: 8, y: 4}
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.clients.connected IS NOT NULL
            | STATS clients = SUM(redis.clients.connected)
          primary:
            field: clients
            label: Clients
      - title: Commands/sec
        position: {x: 16, y: 4}
        size: {w: 8, h: 5}
        description: Gauge metric showing instantaneous commands per second
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.commands IS NOT NULL
            | STATS commands_per_sec = SUM(redis.commands)
          primary:
            field: commands_per_sec
            label: Commands/sec
      - title: Cache Hit Rate
        position: {x: 24, y: 4}
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.keyspace.hits IS NOT NULL OR redis.keyspace.misses IS NOT NULL
            | STATS hits = MAX(redis.keyspace.hits), misses = MAX(redis.keyspace.misses)
            | EVAL hit_rate = hits / (hits + misses + 0.000001)
            | KEEP hit_rate
          primary:
            field: hit_rate
            label: Hit Rate
            format:
              type: percent
      - title: Total Memory Usage
        position: {x: 32, y: 4}
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.memory.used IS NOT NULL
            | STATS memory = SUM(redis.memory.used)
          primary:
            field: memory
            label: Memory
            format:
              type: bytes
      - title: Avg Memory Fragmentation
        position: {x: 40, y: 4}
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.memory.fragmentation_ratio IS NOT NULL
            | STATS fragmentation = AVG(redis.memory.fragmentation_ratio)
          primary:
            field: fragmentation
            label: Fragmentation

      # Section Header
      - position: {x: 0, y: 9}
        size: {w: 48, h: 2}
        markdown:
          content: '## Memory & Performance Trends'
          font_size: 14

      # Memory Usage by Instance (Gauge - use AVG_OVER_TIME)
      - title: Memory Usage by Instance
        position: {x: 0, y: 11}
        size: {w: 24, h: 12}
        esql:
          type: area
          mode: stacked
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.memory.used IS NOT NULL
            | STATS memory = MAX(AVG_OVER_TIME(redis.memory.used))
              BY time_bucket = TBUCKET(1 minute), instance = resource.attributes.service.instance.id
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: memory
              label: Memory Used
              format:
                type: bytes
          breakdown:
            field: instance

      # Commands Per Second (Gauge metric - use AVG_OVER_TIME)
      - title: Commands Per Second
        position: {x: 24, y: 11}
        size: {w: 24, h: 12}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.commands IS NOT NULL
            | STATS commands = MAX(AVG_OVER_TIME(redis.commands))
              BY time_bucket = TBUCKET(1 minute), instance = resource.attributes.service.instance.id
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: commands
              label: Commands/sec
          breakdown:
            field: instance

      # Client Connections Over Time (Sum type but not cumulative - use MAX)
      - title: Client Connections Over Time
        position: {x: 0, y: 23}
        size: {w: 24, h: 12}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.clients.connected IS NOT NULL
            | STATS clients = MAX(AVG_OVER_TIME(redis.clients.connected))
              BY time_bucket = TBUCKET(1 minute), instance = resource.attributes.service.instance.id
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: clients
              label: Connected Clients
          breakdown:
            field: instance

      # Keyspace Hit/Miss Rate (Counter metrics - use RATE)
      - title: Keyspace Hit/Miss Rate
        position: {x: 24, y: 23}
        size: {w: 24, h: 12}
        esql:
          type: area
          mode: stacked
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.keyspace.hits IS NOT NULL OR redis.keyspace.misses IS NOT NULL
            | STATS hits = SUM(RATE(redis.keyspace.hits)), misses = SUM(RATE(redis.keyspace.misses))
              BY time_bucket = TBUCKET(1 minute)
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: hits
              label: Hits/sec
            - field: misses
              label: Misses/sec

      # Section Header
      - position: {x: 0, y: 35}
        size: {w: 48, h: 2}
        markdown:
          content: '## Key Eviction & Expiration'
          font_size: 14

      # Keys Evicted Rate (Counter - use RATE)
      - title: Keys Evicted Rate
        position: {x: 0, y: 37}
        size: {w: 24, h: 12}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.keys.evicted IS NOT NULL
            | STATS evicted = SUM(RATE(redis.keys.evicted))
              BY time_bucket = TBUCKET(1 minute), instance = resource.attributes.service.instance.id
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: evicted
              label: Evicted/sec
          breakdown:
            field: instance

      # Keys Expired Rate (Counter - use RATE)
      - title: Keys Expired Rate
        position: {x: 24, y: 37}
        size: {w: 24, h: 12}
        esql:
          type: line
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.keys.expired IS NOT NULL
            | STATS expired = SUM(RATE(redis.keys.expired))
              BY time_bucket = TBUCKET(1 minute), instance = resource.attributes.service.instance.id
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: expired
              label: Expired/sec
          breakdown:
            field: instance

      # Section Header
      - position: {x: 0, y: 49}
        size: {w: 48, h: 2}
        markdown:
          content: '## Network I/O'
          font_size: 14

      # Network Input (Counter - use RATE)
      - title: Network Input (Bytes Received)
        position: {x: 0, y: 51}
        size: {w: 24, h: 12}
        esql:
          type: area
          mode: stacked
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.net.input IS NOT NULL
            | STATS input = SUM(RATE(redis.net.input))
              BY time_bucket = TBUCKET(1 minute), instance = resource.attributes.service.instance.id
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: input
              label: Input
              format:
                type: bytes
          breakdown:
            field: instance

      # Network Output (Counter - use RATE)
      - title: Network Output (Bytes Sent)
        position: {x: 24, y: 51}
        size: {w: 24, h: 12}
        esql:
          type: area
          mode: stacked
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "redisreceiver.otel"
            | WHERE redis.net.output IS NOT NULL
            | STATS output = SUM(RATE(redis.net.output))
              BY time_bucket = TBUCKET(1 minute), instance = resource.attributes.service.instance.id
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: output
              label: Output
              format:
                type: bytes
          breakdown:
            field: instance

      # Section Header
      - position: {x: 0, y: 63}
        size: {w: 48, h: 2}
        markdown:
          content: '## Instance Summary Table'
          font_size: 14

      # Instance Summary DataTable
      - title: Redis Instance Metrics Summary
        position: {x: 0, y: 65}
        size: {w: 48, h: 20}
        esql:
          type: datatable
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "redisreceiver.otel"
            - WHERE resource.attributes.service.instance.id IS NOT NULL
            - STATS memory = AVG(redis.memory.used), clients = AVG(redis.clients.connected), commands = AVG(redis.commands), hits = MAX(redis.keyspace.hits),
              misses = MAX(redis.keyspace.misses), fragmentation = AVG(redis.memory.fragmentation_ratio), uptime = MAX(redis.uptime) BY instance
              = resource.attributes.service.instance.id
            - EVAL hit_rate = hits / (hits + misses + 0.000001)
            - KEEP instance, memory, clients, commands, hit_rate, fragmentation, uptime
            - SORT memory DESC
            - LIMIT 100
          dimensions:
            - field: instance
            - field: memory
            - field: clients
            - field: commands
            - field: hit_rate
            - field: fragmentation
            - field: uptime
