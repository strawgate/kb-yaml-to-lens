      # Section Header
      - size: {w: 48, h: 3}
        markdown:
          content: '## Node Summary Table'

      # Node Summary DataTable
      - title: Node Metrics Summary
        size: {w: 48, h: 20}
        esql:
          type: datatable
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "rabbitmqreceiver.otel"
            - WHERE resource.attributes.rabbitmq.node.name IS NOT NULL
            - STATS mem_used = MAX(LAST_OVER_TIME(rabbitmq.node.mem_used)), disk_free = MAX(LAST_OVER_TIME(rabbitmq.node.disk_free)), fd_used
              = MAX(LAST_OVER_TIME(rabbitmq.node.fd_used)), sockets_used = MAX(LAST_OVER_TIME(rabbitmq.node.sockets_used)), proc_used = MAX(LAST_OVER_TIME(rabbitmq.node.proc_used)),
              uptime = MAX(LAST_OVER_TIME(rabbitmq.node.uptime)) BY node = resource.attributes.rabbitmq.node.name
            - KEEP node, mem_used, disk_free, fd_used, sockets_used, proc_used, uptime
            - SORT node ASC
            - LIMIT 100
          dimensions:
            - field: node
              label: Node
            - field: mem_used
              label: Memory Used
            - field: disk_free
              label: Disk Free
            - field: fd_used
              label: FD Used
            - field: sockets_used
              label: Sockets
            - field: proc_used
              label: Processes
            - field: uptime
              label: Uptime (ms)
