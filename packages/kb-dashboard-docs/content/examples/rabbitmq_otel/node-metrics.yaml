---
# RabbitMQ OpenTelemetry Node Metrics Dashboard (ES|QL Version)
# Node-level metrics for RabbitMQ using OpenTelemetry rabbitmq receiver
# Uses ES|QL with TS command for time-series optimization
#
# Metrics reference: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/rabbitmqreceiver
#
# IMPORTANT: Node-level metrics are DISABLED by default in the rabbitmq receiver
# Enable them in your collector configuration:
#   receivers:
#     rabbitmq:
#       metrics:
#         rabbitmq.node.mem_used:
#           enabled: true
#  # ... enable other node metrics as needed
dashboards:
  - id: rabbitmq-otel-node
    name: '[Metrics RabbitMQ] Node Metrics'
    description: RabbitMQ node-level metrics for OpenTelemetry rabbitmqreceiver (disabled by default)
    controls:
      - type: options
        id: node-filter
        label: Node
        data_view: metrics-*
        field: resource.attributes.rabbitmq.node.name
    filters:
      - field: data_stream.dataset
        equals: rabbitmqreceiver.otel
    panels:
      # Navigation Links
      - size: {w: 48, h: 2}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: rabbitmq-otel-overview
            - label: Node Metrics
              dashboard: rabbitmq-otel-node
            - label: RabbitMQ Documentation
              url: https://www.rabbitmq.com/docs

      # Section Header
      - size: {w: 48, h: 3}
        markdown:
          content: '## Node Overview'

      # KPI Metrics Row
      - title: Total Nodes
        hide_title: true
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            FROM metrics-*
            | WHERE data_stream.dataset == "rabbitmqreceiver.otel"
            | WHERE resource.attributes.rabbitmq.node.name IS NOT NULL
            | STATS nodes = COUNT_DISTINCT(resource.attributes.rabbitmq.node.name)
          primary:
            field: nodes
            label: Nodes
            format:
              type: number
              decimals: 0
      - title: Memory Alarms
        hide_title: true
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "rabbitmqreceiver.otel"
            | WHERE rabbitmq.node.mem_alarm IS NOT NULL
            | STATS alarms = SUM(LAST_OVER_TIME(rabbitmq.node.mem_alarm))
          primary:
            field: alarms
            label: Mem Alarms
            format:
              type: number
              decimals: 0
      - title: Disk Alarms
        hide_title: true
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "rabbitmqreceiver.otel"
            | WHERE rabbitmq.node.disk_free_alarm IS NOT NULL
            | STATS alarms = SUM(LAST_OVER_TIME(rabbitmq.node.disk_free_alarm))
          primary:
            field: alarms
            label: Disk Alarms
            format:
              type: number
              decimals: 0
      - title: Total FD Used
        hide_title: true
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "rabbitmqreceiver.otel"
            | WHERE rabbitmq.node.fd_used IS NOT NULL
            | STATS fd = SUM(LAST_OVER_TIME(rabbitmq.node.fd_used))
          primary:
            field: fd
            label: FD Used
            format:
              type: number
              decimals: 0
      - title: Total Sockets Used
        hide_title: true
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "rabbitmqreceiver.otel"
            | WHERE rabbitmq.node.sockets_used IS NOT NULL
            | STATS sockets = SUM(LAST_OVER_TIME(rabbitmq.node.sockets_used))
          primary:
            field: sockets
            label: Sockets
            format:
              type: number
              decimals: 0
      - title: Total Processes Used
        hide_title: true
        size: {w: 8, h: 5}
        esql:
          type: metric
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "rabbitmqreceiver.otel"
            | WHERE rabbitmq.node.proc_used IS NOT NULL
            | STATS procs = SUM(LAST_OVER_TIME(rabbitmq.node.proc_used))
          primary:
            field: procs
            label: Processes
            format:
              type: number
              decimals: 0

      # Section Header
      - size: {w: 48, h: 3}
        markdown:
          content: '## Memory & Disk'

      # Memory Usage (Gauge - use LAST_OVER_TIME)
      - title: Memory Used by Node
        size: {w: 24, h: 12}
        esql:
          type: area
          mode: stacked
          query: |
            TS metrics-*
            | WHERE data_stream.dataset == "rabbitmqreceiver.otel"
            | WHERE rabbitmq.node.mem_used IS NOT NULL
            | STATS memory = MAX(LAST_OVER_TIME(rabbitmq.node.mem_used))
              BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend), node = resource.attributes.rabbitmq.node.name
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
            label: Time
            data_type: date
          metrics:
            - field: memory
              label: Memory Used
              format:
                type: bytes
          breakdown:
            field: node

      # Disk Free (Gauge - use LAST_OVER_TIME)
      - title: Disk Free by Node
