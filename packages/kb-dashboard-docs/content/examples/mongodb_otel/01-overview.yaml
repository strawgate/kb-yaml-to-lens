          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
            label: Time
            data_type: date
          metrics:
            - field: op_time
              label: Time (ms/sec)
          breakdown:
            field: operation

      # Network Requests Rate
      - title: Network Requests Rate
        size: {w: 24, h: 12}
