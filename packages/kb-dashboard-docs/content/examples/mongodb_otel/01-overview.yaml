            | STATS ops_rate = SUM(RATE(mongodb.operation.count))
              BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend), operation = attributes.operation
            | SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
            label: Time
            data_type: date
          metrics:
            - field: ops_rate
              label: Operations/sec
          breakdown:
            field: operation

