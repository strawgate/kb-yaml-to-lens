# ES|QL Version - Uses TS command for time-series optimization
dashboards:
  - id: docker-otel-container-stats
    name: '[Metrics Docker] Container Stats'
    description: Detailed Docker container statistics using OpenTelemetry Docker Stats receiver (ES|QL version)
    controls:
      - type: options
        label: Container image
        data_view: metrics-*
        field: container.image.name
      - type: options
        label: Container name
        data_view: metrics-*
        field: container.name
      - type: options
        label: Container hostname
        data_view: metrics-*
        field: container.hostname
      - type: options
        label: Container ID
        data_view: metrics-*
        field: container.id
    filters:
      - field: data_stream.dataset
        equals: dockerstatsreceiver.otel
    panels:
      # Navigation Links
      - title: Navigation Links
        size: {w: 48, h: 2}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: docker-otel-overview
            - label: Container Stats
              dashboard: docker-otel-container-stats

      # Warning markdown panel
      - size: {w: 48, h: 2}
        markdown:
          content: This dashboard is only intended to be used when filtered to one container at a time.

      # Container count metric
      - title: Containers count
        size: {w: 7, h: 4}
        hide_title: true
        esql:
          type: metric
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - STATS selected_containers = COUNT_DISTINCT(container.id)
          primary:
            field: selected_containers
            label: Selected Containers
            format:
              type: number
              decimals: 0

      # Container info table
      - title: Container info
        size: {w: 41, h: 4}
        esql:
          type: datatable
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - STATS cpu_usage = MAX(AVG_OVER_TIME(container.cpu.utilization)) / 100, memory_pct = MAX(AVG_OVER_TIME(container.memory.percent))
              / 100, memory_bytes = MAX(AVG_OVER_TIME(container.memory.usage.total)) BY container_name = container.name, container_image = container.image.name,
              runtime = container.runtime, container_id = container.id, hostname = container.hostname
            - KEEP container_name, container_image, runtime, container_id, hostname, cpu_usage, memory_pct, memory_bytes
            - LIMIT 10
          dimensions:
            - field: container_name
            - field: container_image
            - field: runtime
            - field: container_id
            - field: hostname
          metrics:
            - field: cpu_usage
              label: CPU Usage
              format:
                type: percent
            - field: memory_pct
              label: Memory Usage
              format:
                type: percent
            - field: memory_bytes
              label: Memory (Bytes)
              format:
                type: bytes

      # CPU Usage (line chart)
      - title: CPU Usage
        size: {w: 48, h: 9}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.cpu.utilization IS NOT NULL
            - STATS cpu_usage = MAX(AVG_OVER_TIME(container.cpu.utilization)) / 100 BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend)
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: cpu_usage
              label: CPU Usage
              format:
                type: percent

      # Memory Usage (line chart)
      - title: Memory Usage
        size: {w: 48, h: 9}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.memory.usage.total IS NOT NULL
            - STATS memory_bytes = MAX(AVG_OVER_TIME(container.memory.usage.total)) BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend)
            - SORT time_bucket ASC
          legend:
            visible: hide
          dimension:
            field: time_bucket
          metrics:
            - field: memory_bytes
              label: Memory Usage
              format:
                type: bytes

      # Disk I/O (line chart by device)
      - title: Disk I/O
        size: {w: 48, h: 9}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.blockio.io_service_bytes_recursive IS NOT NULL
            - STATS io_rate = SUM(RATE(container.blockio.io_service_bytes_recursive)) BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend),
              device = attributes.device_major
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: io_rate
              label: Bytes
              format:
                type: bytes
          breakdown:
            field: device

      # Network I/O (line chart with rx and tx)
      - title: Network I/O
        size: {w: 48, h: 9}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.network.io.usage.rx_bytes IS NOT NULL OR container.network.io.usage.tx_bytes IS NOT NULL
            - STATS rx_rate = SUM(RATE(container.network.io.usage.rx_bytes)), tx_rate = SUM(RATE(container.network.io.usage.tx_bytes)) BY time_bucket
              = BUCKET(@timestamp, 20, ?_tstart, ?_tend), interface = attributes.interface
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: rx_rate
              label: Received Bytes
              format:
                type: bytes
            - field: tx_rate
              label: Transmitted Bytes
              format:
                type: bytes
          breakdown:
            field: interface

      # "Detailed information" markdown panel
      - size: {w: 48, h: 3}
        markdown:
          content: '## Detailed information'

      # CPU Usage (area stacked chart)
      - title: CPU Usage
        size: {w: 48, h: 9}
        esql:
          type: area
          mode: stacked
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.cpu.utilization IS NOT NULL
            - STATS cpu_usage = MAX(AVG_OVER_TIME(container.cpu.utilization)) / 100 BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend)
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: cpu_usage
              label: CPU %
              format:
                type: percent

      # Memory Usage with limit (line chart)
      - title: Memory Usage with limit
        size: {w: 24, h: 9}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.memory.usage.total IS NOT NULL OR container.memory.usage.limit IS NOT NULL
            - STATS memory_usage = MAX(AVG_OVER_TIME(container.memory.usage.total)), memory_limit = MAX(LAST_OVER_TIME(container.memory.usage.limit))
              BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend)
            - SORT time_bucket ASC
          legend:
            visible: hide
          dimension:
            field: time_bucket
          metrics:
            - field: memory_usage
              label: Memory Usage
              format:
                type: bytes
            - field: memory_limit
              label: Memory Limit
              format:
                type: bytes

      # Memory Usage (line chart percentage)
      - title: Memory Usage
        size: {w: 24, h: 9}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.memory.percent IS NOT NULL
            - STATS memory_pct = MAX(AVG_OVER_TIME(container.memory.percent)) / 100 BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend)
            - SORT time_bucket ASC
          legend:
            visible: hide
          dimension:
            field: time_bucket
          metrics:
            - field: memory_pct
              label: Memory %
              format:
                type: percent

      # Disk I/O (line chart by device) - second visualization
      - title: Disk I/O
        size: {w: 48, h: 9}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.blockio.io_service_bytes_recursive IS NOT NULL
            - STATS io_rate = SUM(RATE(container.blockio.io_service_bytes_recursive)) BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend),
              device = attributes.device_major
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: io_rate
              label: Bytes
              format:
                type: bytes
          breakdown:
            field: device

      # Network - Received Bytes (line chart)
      - title: Network - Received Bytes
        size: {w: 24, h: 9}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.network.io.usage.rx_bytes IS NOT NULL
            - STATS rx_rate = SUM(RATE(container.network.io.usage.rx_bytes)) BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend), interface
              = attributes.interface
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: rx_rate
              label: Bytes
              format:
                type: bytes
          breakdown:
            field: interface

      # Network - Transmitted Bytes (line chart)
      - title: Network - Transmitted Bytes
        size: {w: 24, h: 9}
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.network.io.usage.tx_bytes IS NOT NULL
            - STATS tx_rate = SUM(RATE(container.network.io.usage.tx_bytes)) BY time_bucket = BUCKET(@timestamp, 20, ?_tstart, ?_tend), interface
              = attributes.interface
            - SORT time_bucket ASC
          legend:
            visible: show
            position: right
          dimension:
            field: time_bucket
          metrics:
            - field: tx_rate
              label: Bytes
              format:
                type: bytes
          breakdown:
            field: interface
