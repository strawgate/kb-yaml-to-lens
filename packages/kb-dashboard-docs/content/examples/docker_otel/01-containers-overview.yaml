# ES|QL Version - Uses TS command for time-series optimization
dashboards:
  - id: docker-otel-overview
    name: '[Metrics Docker] Overview'
    description: >-
      Docker container metrics overview using OpenTelemetry Docker Stats
      receiver (ES|QL version)
    controls:
      - type: options
        label: Container image
        data_view: metrics-*
        field: container.image.name
      - type: options
        label: Container name
        data_view: metrics-*
        field: container.name
      - type: options
        label: Container hostname
        data_view: metrics-*
        field: container.hostname
      - type: options
        label: Container ID
        data_view: metrics-*
        field: container.id
    filters:
      - field: data_stream.dataset
        equals: dockerstatsreceiver.otel
    panels:
      # Navigation Links
      - title: Navigation Links
        size: {w: 48, h: 2}
        links:
          layout: horizontal
          items:
            - label: Overview
              dashboard: docker-otel-overview
            - label: Container Stats
              dashboard: docker-otel-container-stats

      # KPI Metrics Row
      - title: Active Containers
        hide_title: true
        size: {w: 6, h: 4}
        esql:
          type: metric
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE `@timestamp` >= ?_tstart AND `@timestamp` <= ?_tend
            - STATS active_containers = COUNT_DISTINCT(container.id)
          primary:
            field: active_containers
            label: Active Containers
            format:
              type: number
              decimals: 0
      - title: Total Containers
        hide_title: true
        size: {w: 6, h: 4}
        esql:
          type: metric
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE `@timestamp` >= ?_tstart AND `@timestamp` <= ?_tend
            - STATS total_containers = COUNT_DISTINCT(container.id)
          primary:
            field: total_containers
            label: Total Containers
            format:
              type: number
              decimals: 0
      - title: Containers Over Time
        hide_title: true
        size: {w: 36, h: 6}
        esql:
          type: bar
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - STATS containers = COUNT_DISTINCT(container.id) BY time_bucket = BUCKET(`@timestamp`, 20, ?_tstart, ?_tend)
            - SORT time_bucket ASC
          dimension:
            field: time_bucket
          metrics:
            - field: containers
              label: Containers
              format:
                type: number
                decimals: 0

      # Summary Tables
      - title: Containers by Runtime
        size: {w: 16, h: 11}
        esql:
          type: datatable
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - STATS Containers = COUNT_DISTINCT(container.id) BY Runtime = container.runtime
            - SORT Containers DESC
            - LIMIT 10
          dimensions:
            - field: Runtime
          metrics:
            - field: Containers
      - title: Containers by Image
        size: {w: 16, h: 11}
        esql:
          type: datatable
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - STATS Containers = COUNT_DISTINCT(container.id) BY Image = container.image.name
            - SORT Containers DESC
            - LIMIT 50
          dimensions:
            - field: Image
          metrics:
            - field: Containers
      - title: Containers by Name
        size: {w: 16, h: 11}
        esql:
          type: datatable
          query:
            - FROM metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - STATS Containers = COUNT_DISTINCT(container.id) BY Name = container.name
            - SORT Containers DESC
            - LIMIT 50
          dimensions:
            - field: Name
          metrics:
            - field: Containers

      # CPU Usage Time Series
      - title: CPU Usage
        size: {w: 48, h: 8}
        hide_title: true
        esql:
          type: line
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.cpu.utilization IS NOT NULL
            - STATS cpu_usage = AVG(container.cpu.utilization) / 100 BY time_bucket = BUCKET(`@timestamp`, 20, ?_tstart, ?_tend),
              container_name = container.name
            - SORT time_bucket ASC
          dimension:
            field: time_bucket
          metrics:
            - field: cpu_usage
              label: CPU Usage
              format:
                type: percent
          breakdown:
            field: container_name

      # Memory Usage Time Series
      - title: Memory Usage
        size: {w: 24, h: 8}
        hide_title: true
        esql:
          type: area
          mode: stacked
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.memory.percent IS NOT NULL
            - STATS memory_usage = AVG(container.memory.percent) / 100 BY time_bucket = BUCKET(`@timestamp`, 20, ?_tstart, ?_tend),
              container_name = container.name
            - SORT time_bucket ASC
          dimension:
            field: time_bucket
          metrics:
            - field: memory_usage
              label: Memory Usage
              format:
                type: percent
          breakdown:
            field: container_name
      - title: Memory Usage (Bytes)
        size: {w: 24, h: 8}
        hide_title: true
        esql:
          type: area
          mode: stacked
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.memory.usage.total IS NOT NULL
            - STATS memory_bytes = AVG(container.memory.usage.total) BY time_bucket = BUCKET(`@timestamp`, 20, ?_tstart, ?_tend),
              container_name = container.name
            - SORT time_bucket ASC
          dimension:
            field: time_bucket
          metrics:
            - field: memory_bytes
              label: Memory Usage
              format:
                type: bytes
          breakdown:
            field: container_name

      # Disk I/O Time Series
      - title: Disk I/O - Read
        size: {w: 24, h: 8}
        esql:
          type: area
          mode: stacked
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.blockio.io_service_bytes_recursive IS NOT NULL
            - WHERE attributes.operation == "read"
            - STATS read_rate = SUM(RATE(container.blockio.io_service_bytes_recursive)) BY time_bucket = BUCKET(`@timestamp`, 20, ?_tstart, ?_tend),
              container_name = container.name
            - SORT time_bucket ASC
          dimension:
            field: time_bucket
          metrics:
            - field: read_rate
              label: Bytes
              format:
                type: bytes
          breakdown:
            field: container_name
      - title: Disk I/O - Write
        size: {w: 24, h: 8}
        esql:
          type: area
          mode: stacked
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.blockio.io_service_bytes_recursive IS NOT NULL
            - WHERE attributes.operation == "write"
            - STATS write_rate = SUM(RATE(container.blockio.io_service_bytes_recursive)) BY time_bucket = BUCKET(`@timestamp`, 20, ?_tstart, ?_tend),
              container_name = container.name
            - SORT time_bucket ASC
          dimension:
            field: time_bucket
          metrics:
            - field: write_rate
              label: Bytes
              format:
                type: bytes
          breakdown:
            field: container_name

      # Network I/O Time Series
      - title: Network I/O - Received
        size: {w: 24, h: 8}
        esql:
          type: area
          mode: stacked
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.network.io.usage.rx_bytes IS NOT NULL
            - STATS rx_rate = SUM(RATE(container.network.io.usage.rx_bytes)) BY time_bucket = BUCKET(`@timestamp`, 20, ?_tstart, ?_tend),
              container_name = container.name
            - SORT time_bucket ASC
          dimension:
            field: time_bucket
          metrics:
            - field: rx_rate
              label: Bytes
              format:
                type: bytes
          breakdown:
            field: container_name
      - title: Network I/O - Transmitted
        size: {w: 24, h: 8}
        esql:
          type: area
          mode: stacked
          query:
            - TS metrics-*
            - WHERE data_stream.dataset == "dockerstatsreceiver.otel"
            - WHERE container.network.io.usage.tx_bytes IS NOT NULL
            - STATS tx_rate = SUM(RATE(container.network.io.usage.tx_bytes)) BY time_bucket = BUCKET(`@timestamp`, 20, ?_tstart, ?_tend),
              container_name = container.name
            - SORT time_bucket ASC
          dimension:
            field: time_bucket
          metrics:
            - field: tx_rate
              label: Bytes
              format:
                type: bytes
          breakdown:
            field: container_name
