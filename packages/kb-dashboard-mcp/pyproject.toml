[project]
name = "kb-dashboard-mcp"
version = "0.1.0"
description = "MCP server for Kibana dashboard building with Elasticsearch data exploration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pydantic>=2.12",
    "click>=8.3",
    "rich-click>=1.9.0",
    "fastmcp>=2.0,<3.0",
    "kb-dashboard-tools",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.3",
    "pytest-aiohttp>=1.1.0",
]

[tool.uv.sources]
kb-dashboard-tools = { workspace = true }

[project.scripts]
kb-mcp = "kb_dashboard_mcp.cli:cli"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = "-vv"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kb_dashboard_mcp"

# Ruff and basedpyright settings are inherited from root pyproject.toml

[tool.coverage.run]
source = ["src/kb_dashboard_mcp"]
branch = true
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"
show_contexts = false
