[project]
name = "kb-dashboard-mcp"
version = "0.1.0"
description = "MCP server for Kibana dashboard building with Elasticsearch data exploration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pydantic>=2.12",
    "click>=8.3",
    "rich-click>=1.9.0",
    "fastmcp>=2.0",
    "kb-dashboard-compiler",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.3",
    "pytest-aiohttp>=1.1.0",
    "ruff>=0.14.14",
    "basedpyright>=1.37.2",
]

[tool.uv.sources]
kb-dashboard-compiler = { workspace = true }

[project.scripts]
kb-mcp = "kb_dashboard_mcp.cli:cli"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
addopts = "-vv"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kb_dashboard_mcp"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
extend-select = [
    "A", "ARG", "B", "C4", "COM", "DTZ", "E", "EM", "F", "FURB", "I",
    "LOG", "N", "PERF", "PIE", "PLR", "PLW", "PT", "PTH", "Q", "RET",
    "RSE", "RUF", "S", "SIM", "TC", "TID", "TRY", "UP", "W",
    "D",
    "ANN",
    "PLE",
    "T10",
    "ISC",
    "FA",
    "PGH",
    "INP",
]
ignore = [
    "COM812",
    "D203",
    "D213",
    "D413",
    "D100",
    "A002",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/kb_dashboard_mcp/cli.py" = [
    "PLR0913",  # CLI commands with click options have many arguments
]
"tests/**/*.py" = [
    "S101",
    "S105",  # Hardcoded passwords OK in tests
    "S106",  # Hardcoded passwords OK in tests
    "PLR2004",
    "INP001",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["kb_dashboard_mcp"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.coverage.run]
source = ["src/kb_dashboard_mcp"]
branch = true
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"
show_contexts = false

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
reportImportCycles = "error"
reportExplicitAny = false
reportIncompatibleVariableOverride = false
include = ["src/kb_dashboard_mcp", "tests"]
exclude = [
    "**/.venv/**",
]

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportAny = false
reportArgumentType = false
reportCallIssue = false
reportMissingImports = false
reportUninitializedInstanceVariable = false
reportUnusedCallResult = false
reportImplicitOverride = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUntypedNamedTuple = false
reportUnknownMemberType = false
reportAttributeAccessIssue = false

[[tool.basedpyright.executionEnvironments]]
root = "src/kb_dashboard_mcp"
# FastMCP tool registration returns unused Tool objects
reportMissingTypeStubs = false
reportAny = false
reportUnusedCallResult = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
