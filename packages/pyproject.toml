[project]
name = "kb-dashboard-packages"
version = "0.1.10"
description = "UV workspace for kb-dashboard namespace packages"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.uv.workspace]
members = [
    "kb-dashboard-core",
    "kb-dashboard-cli",
    "kb-dashboard-lsp",
    "kb-dashboard-tools",
    "kb-dashboard-compiler",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-freezer>=0.4.9",
    "deepdiff>=8.4.2",
    "ruff>=0.14",
    "pytest-asyncio>=1.3",
    "basedpyright>=1.36",
    "inline-snapshot>=0.31.1",
    "pytest-check-links>=0.9.0",
    "dirty-equals>=0.8.0",
    "pytest-examples>=0.0.18",
    "yamlfix>=1.17.0",
]
