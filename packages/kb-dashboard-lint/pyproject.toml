[project]
name = "kb-dashboard-lint"
version = "0.1.10"
description = "Linting rules for dashboard YAML configurations"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "kb-dashboard-compiler",
    "pydantic>=2.12",
    "beartype>=0.22",
    "click>=8.3",
    "rich-click>=1.9.0",
    "pyyaml>=6.0.3",
    "ruamel.yaml>=0.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "ruff>=0.14",
]

[project.scripts]
kb-dashboard-lint = "dashboard_lint.cli:cli"

[tool.pytest.ini_options]
addopts = "-vv"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dashboard_lint"

[tool.uv.sources]
kb-dashboard-compiler = { workspace = true }

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
extend-select = [
    "A", "ARG", "B", "C4", "COM", "DTZ", "E", "EM", "F", "FURB", "I",
    "LOG", "N", "PERF", "PIE", "PLR", "PLW", "PT", "PTH", "Q", "RET",
    "RSE", "RUF", "S", "SIM", "TC", "TID", "TRY", "UP", "W",
    "D",
    "ANN", "PLE", "T10", "ISC", "FA", "PGH", "INP",
]
ignore = [
    "COM812",
    "D203",
    "D213",
    "D413",
    "D100",
    "A002",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = [
    "S101",
    "PLR2004",
    "INP001",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
known-first-party = ["dashboard_lint", "dashboard_compiler"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.coverage.run]
source = ["src/dashboard_lint"]
branch = true
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
reportImportCycles = "error"
reportExplicitAny = false
reportIncompatibleVariableOverride = false
reportUnusedCallResult = false
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnannotatedClassAttribute = false
reportUnusedParameter = false
reportUnreachable = false
reportUnnecessaryIsInstance = false
include = ["src/dashboard_lint", "tests"]
exclude = [
    "**/.venv/**",
    "**/output/**",
]

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportAny = false
reportArgumentType = false
reportCallIssue = false
reportMissingImports = false
reportUninitializedInstanceVariable = false
reportUnusedCallResult = false
reportImplicitOverride = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUntypedNamedTuple = false

[[tool.basedpyright.executionEnvironments]]
root = "src/dashboard_lint"
