[project]
name = "kb-dashboard-compiler"
version = "0.1.10"
description = "Meta-package that installs all kb-dashboard packages for backwards compatibility"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "kb-dashboard-core",
    "kb-dashboard-cli",
    "kb-dashboard-tools",
]

[tool.uv.sources]
kb-dashboard-core = { workspace = true }
kb-dashboard-cli = { workspace = true }
kb-dashboard-tools = { workspace = true }

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_dashboard_compiler"]
