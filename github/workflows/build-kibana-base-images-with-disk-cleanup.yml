---
# Test workflow: Build Kibana Base Images with Disk Cleanup
#
# This workflow tests the jlumbroso/free-disk-space action to free up
# disk space before building Kibana base images.
#
# To test: Move this file to .github/workflows/ and trigger manually.
# If successful, merge the free-disk-space step into build-kibana-base-images.yml

name: "[TEST] Build Kibana Base Images with Disk Cleanup"
on:
  workflow_dispatch:
    inputs:
      kibana_version:
        description: "Kibana version to build (e.g., v9.2.0)"
        required: true
        default: "v9.2.0"
        type: string
      platform:
        description: "Platform to build"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  build-with-disk-cleanup:
    name: Build with Disk Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Show initial disk space
        run: |
          echo "=== Initial disk space ==="
          df -h /
          echo ""
          echo "=== Large directories ==="
          du -sh /usr/local /opt /home 2>/dev/null || true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          # Remove Android SDK (~14 GB) - not needed for Docker/Node builds
          android: true

          # Remove .NET runtime (~2.7 GB) - not needed for Node.js/Kibana
          dotnet: true

          # Remove Haskell runtime (~0 GB) - minimal but safe to remove
          haskell: true

          # Remove large misc packages (~5.3 GB) - not needed
          large-packages: true

          # Remove pre-cached Docker images (varies) - building fresh anyway
          docker-images: true

          # Remove swap storage (~4 GB) - safe for build workloads
          swap-storage: true

          # KEEP tool-cache (~5.9 GB) - may contain tools we need
          # The Dockerfile installs its own Node.js, but keeping this
          # avoids potential issues with other pre-installed tools
          tool-cache: false

      - name: Show disk space after cleanup
        run: |
          echo "=== Disk space after cleanup ==="
          df -h /
          echo ""
          echo "=== Large directories ==="
          du -sh /usr/local /opt /home 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform suffix
        id: platform
        run: |
          echo "suffix=$(echo '${{ inputs.platform }}' | sed 's/linux\///')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/kibana-base
          tags: |
            type=raw,value=${{ inputs.kibana_version }}-test-${{ steps.platform.outputs.suffix }}

      - name: Build and push Kibana base image
        uses: docker/build-push-action@v6
        with:
          context: ./fixture-generator
          file: ./fixture-generator/Dockerfile.base
          platforms: ${{ inputs.platform }}
          build-args: |
            KIBANA_VERSION=${{ inputs.kibana_version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use inline cache for test builds
          cache-from: type=gha,scope=kibana-test-${{ inputs.kibana_version }}-${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=kibana-test-${{ inputs.kibana_version }}-${{ inputs.platform }}

      - name: Show final disk space
        run: |
          echo "=== Final disk space ==="
          df -h /
          echo ""
          echo "Build completed successfully!"

      - name: Image info
        run: |
          echo "Built and pushed Kibana base image:"
          echo "  Version: ${{ inputs.kibana_version }}"
          echo "  Platform: ${{ inputs.platform }}"
          echo "  Tags: ${{ steps.meta.outputs.tags }}"
