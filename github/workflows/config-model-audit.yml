---
# NOTE: This file lives in github/workflows/ and must be moved to
# .github/workflows/ by a maintainer before it will run.
name: 'Audit: Config Model Drift'
on:
  schedule:
    - cron: 0 10 * * 1
  workflow_dispatch: null
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run config model audit
        id: audit
        run: |
          set +e
          output=$(python scripts/audit-config-models.py)
          exit_code=$?
          set -e

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "report<<$EOF"
            echo "$output"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

          echo "drift_found=$( [ $exit_code -ne 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Create or update issue
        if: steps.audit.outputs.drift_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[config-model-audit] Configuration drift detected';
            const label = 'config-drift';
            const body = `${{ steps.audit.outputs.report }}

            ---
            _Generated by the Config Model Drift audit workflow._`;

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'e4e669',
                description: 'Automated: configuration model drift detected',
              });
            }

            // Find existing open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1,
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
              core.info(`Updated issue #${issues[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Created issue #${issue.number}`);
            }

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.audit.outputs.drift_found }}" = "true" ]; then
            echo "::warning::Configuration drift detected — see workflow output"
          else
            echo "No configuration drift detected."
          fi
