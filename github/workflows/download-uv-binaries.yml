---
name: Download uv Binaries (Reusable)
on:
  workflow_call:
    inputs:
      uv-version:
        description: Version of uv to download
        required: false
        type: string
        default: 0.9.18
      artifact-prefix:
        description: Prefix for artifact names
        required: false
        type: string
        default: uv
      retention-days:
        description: Number of days to retain artifacts
        required: false
        type: number
        default: 7
jobs:
  download-uv:
    name: Download uv - ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux-x64
            uv-target: x86_64-unknown-linux-gnu
            binary-name: uv
          - platform: darwin-x64
            uv-target: x86_64-apple-darwin
            binary-name: uv
          - platform: darwin-arm64
            uv-target: aarch64-apple-darwin
            binary-name: uv
          - platform: win32-x64
            uv-target: x86_64-pc-windows-msvc
            binary-name: uv.exe
    steps:
      - name: Download uv binary
        run: |
          mkdir -p bin
          curl -fsSL --retry 3 \
            "https://github.com/astral-sh/uv/releases/download/${{ inputs.uv-version }}/uv-${{ matrix.uv-target }}.tar.gz" \
            -o uv.tar.gz
          tar -xzf uv.tar.gz
          cp "uv-${{ matrix.uv-target }}/${{ matrix.binary-name }}" "bin/${{ matrix.binary-name }}"
          chmod +x "bin/${{ matrix.binary-name }}"
          rm -rf uv.tar.gz "uv-${{ matrix.uv-target }}"
      - name: Verify uv binary
        if: matrix.platform == 'linux-x64'
        run: |
          ./bin/uv --version
      - name: Upload uv artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.platform }}
          path: bin/${{ matrix.binary-name }}
          retention-days: ${{ inputs.retention-days }}
