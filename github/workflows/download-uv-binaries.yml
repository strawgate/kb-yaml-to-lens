---
name: Download uv Binaries (Reusable)
on:
  workflow_call:
    inputs:
      uv-version:
        description: Version of uv to download
        required: false
        type: string
        default: 0.9.18
      artifact-prefix:
        description: Prefix for artifact names
        required: false
        type: string
        default: uv
      retention-days:
        description: Number of days to retain artifacts
        required: false
        type: number
        default: 7
jobs:
  download-uv:
    name: Download uv - ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux-x64
            binary-name: uv
          - platform: darwin-x64
            binary-name: uv
          - platform: darwin-arm64
            binary-name: uv
          - platform: win32-x64
            binary-name: uv.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            vscode-extension/scripts/download_uv.sh
          sparse-checkout-cone-mode: false
      - name: Download uv binary
        run: |
          UV_VERSION="${{ inputs.uv-version }}" \
            bash vscode-extension/scripts/download_uv.sh "${{ matrix.platform }}"
      - name: Verify uv binary
        if: matrix.platform == 'linux-x64'
        run: |
          ./vscode-extension/bin/${{ matrix.platform }}/uv --version
      - name: Upload uv artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.platform }}
          path: vscode-extension/bin/${{ matrix.platform }}/${{ matrix.binary-name }}
          retention-days: ${{ inputs.retention-days }}
