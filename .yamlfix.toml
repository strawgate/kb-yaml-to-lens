# yamlfix configuration
# https://lyz-code.github.io/yamlfix/

line_length = 140
sequence_style = "block_style"
none_representation = "null"

# Exclude patterns
exclude = [
  ".venv/**",
  "venv/**",
  "node_modules/**",
  "dist/**",
  "build/**",
  "output/**",
  "htmlcov/**",
  ".git/**",
  "vscode-extension/node_modules/**",
  "vscode-extension/.vscode-test/**",
]
