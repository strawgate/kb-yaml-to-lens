---
dashboards:
  - name: '[OTel] Host Details - Logs'
    description: 'Host log messages from OpenTelemetry logs collection'
    filters:
      - exists: resource.attributes.host.name
    controls:
      - type: options
        label: Host Name
        data_view: logs-*
        field: resource.attributes.host.name
    panels:
      - title: Navigation Links
        grid: {x: 0, y: 0, w: 48, h: 2}
        description: 'Links to related dashboards (update URLs after importing to Kibana)'
        links:
          layout: horizontal
          links:
            - label: Hosts Overview
              url: '#'
            - label: Host Overview
              url: '#'
            - label: Host Metrics
              url: '#'
            - label: Host Metadata
              url: '#'
            - label: Host Logs
              url: '#'
      - title: Logs
        grid: {x: 0, y: 2, w: 48, h: 56}
        esql:
          type: datatable
          query:
            - FROM logs-*
            - WHERE resource.attributes.host.name IS NOT NULL
            - SORT @timestamp DESC
            - LIMIT 1000
            - KEEP message, @timestamp
