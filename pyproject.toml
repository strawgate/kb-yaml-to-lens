# Root pyproject.toml - Global tooling (docs, linting)
# For the dashboard-compiler package configuration, see compiler/pyproject.toml

[dependency-groups]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.30.0",
    "pymdown-extensions>=10.0",
]
lint = [
    "yamlfix>=1.17.0",
    "pytest>=7.0,<9.0",
    "pytest-check-links>=0.9.0",
]
