[project]
name = "kb-dashboard-compiler-root"
version = "0.1.10"
description = "Root project for the kb-yaml-to-lens project"
readme = "./README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "kb-dashboard-compiler",
    "kb-dashboard-lint",
    "click>=8.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.37",
    "yamlfix>=1.19.0",
    "ruff>=0.14",
]

[tool.uv.sources]
kb-dashboard-compiler = { workspace = true }
kb-dashboard-lint = { workspace = true }

[tool.uv.workspace]
members = ["packages/kb-dashboard-compiler", "packages/kb-dashboard-lint", "packages/kb-dashboard-docs"]


[tool.ruff]
line-length = 140
# Assume Python 3.12
target-version = "py312"
# Add commonly ignored directories
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "reference",
    "**/*.old.py",
]

[tool.ruff.lint]

# When using extend-select, a rule like PLR will enable PLR* rules like PLR0###.
extend-select = [
    "A", "ARG", "B", "C4", "COM", "DTZ", "E", "EM", "F", "FURB", "I",
    "LOG", "N", "PERF", "PIE", "PLR", "PLW", "PT", "PTH", "Q", "RET",
    "RSE", "RUF", "S", "SIM", "TC", "TID", "TRY", "UP", "W",
    "D",  # Add docstring checks since kb-yaml-to-lens uses them
    # Additional quality and safety rules:
    "ANN",  # flake8-annotations - Type annotations
    "PLE",  # Pylint errors - Serious bug detection
    "T10",  # flake8-debugger - Prevent debugger statements
    "ISC",  # flake8-implicit-str-concat - Prevent string concat bugs
    "FA",   # flake8-future-annotations - Modern type hints (PEP 563)
    "PGH",  # pygrep-hooks - Additional code quality checks
    "INP",  # flake8-no-pep420 - Explicit namespace packages
]
ignore = [
    "COM812",  # Conflicts with formatter
    "D203",    # incorrect-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "D413",    # multi-line-summary-second-line
    # D100: Module docstrings are optional in this codebase.
    # Many modules (types, compile, config) are self-documenting via their contents.
    "D100",
    # A002: Kibana API compatibility requires fields like `type`, `id`, `filter`, `format`
    # that shadow builtins. This affects 50+ files throughout the codebase.
    "A002",
    # ANN401: Delegate Any checking to Pyright for more granular analysis.
    # ~30 files at system boundaries use Any appropriately.
    "ANN401",
]

# Per-file rule ignores
[tool.ruff.lint.per-file-ignores]
"packages/kb-dashboard-compiler/**/__init__.py" = ["F401"]    # Ignore unused imports in __init__.py files
"packages/kb-dashboard-lint/**/__init__.py" = ["F401"]    # Ignore unused imports in __init__.py files
# Test files have relaxed linting for common test patterns.
"packages/kb-dashboard-compiler/tests/**/*.py" = [
    "S101",    # Allow assert usage in tests
    "PLR2004", # Allow magic values in test assertions
    "INP001",  # Tests are not meant to be imported as packages
]
# Test files have relaxed linting for common test patterns.
"packages/kb-dashboard-lint/tests/**/*.py" = [
    "S101",    # Allow assert usage in tests
    "PLR2004", # Allow magic values in test assertions
    "INP001",  # Tests are not meant to be imported as packages
    "F401",    # Allow side-effect imports for rule registration
]
"packages/kb-dashboard-lint/src/dashboard_lint/cli.py" = [
    "F401", # Allow side-effect imports for rule registration
]
# View models use camelCase field names to match Kibana's JSON API schema.
# N815/N803: camelCase field names required for Kibana API compatibility.
# D101: Utility view model classes where docstrings add noise without value.
"packages/kb-dashboard-compiler/src/dashboard_compiler/**/view.py" = [
    "N815",
    "N803",
    "D101",
]
# Grid files are validation-heavy CLI/LSP entry points with inherent complexity.
# PLR rules: Allow complexity metrics (statements, branches, returns) for these files.
"packages/kb-dashboard-compiler/src/dashboard_compiler/lsp/grid_*.py" = [
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]
"packages/kb-dashboard-lint/src/dashboard_lint/config.py" = [
    "PLR0911", # Allow many return statements for config loading
]
"packages/kb-dashboard-lint/src/dashboard_lint/yaml_position_resolver.py" = [
    "PLR0911", # Allow many return statements in navigation logic
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["dashboard_compiler", "dashboard_lint"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.validator"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
reportImportCycles = "error"
reportExplicitAny = false
include = ["packages"]
exclude = [
    "**/.venv/**",
    "**/output/**",
    "**/*.old.py",
    "**/kb-dashboard-docs/**",  # Docs hooks use mkdocs which isn't in root deps
    "**/vscode-extension/**",  # TypeScript extension, not Python
]

[[tool.basedpyright.executionEnvironments]]
root = "packages/kb-dashboard-compiler/src"
extraPaths = ["packages/kb-dashboard-compiler/src"]
reportIncompatibleVariableOverride = false

[[tool.basedpyright.executionEnvironments]]
root = "packages/kb-dashboard-compiler/tests"
# Tests use many libraries and test patterns that trigger type warnings.
# The volume of warnings makes inline ignores impractical for test code.
extraPaths = ["packages/kb-dashboard-compiler/src"]
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportAny = false
reportArgumentType = false
reportCallIssue = false
reportMissingImports = false
reportUninitializedInstanceVariable = false
reportUnusedCallResult = false
reportImplicitOverride = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUntypedNamedTuple = false

[[tool.basedpyright.executionEnvironments]]
root = "packages/kb-dashboard-compiler/src/dashboard_compiler/yaml_roundtrip.py"
# ruamel.yaml lacks type stubs and returns dynamic types from load/dump operations.
reportAny = false
reportUnknownMemberType = false

[[tool.basedpyright.executionEnvironments]]
root = "packages/kb-dashboard-lint/src"
extraPaths = ["packages/kb-dashboard-lint/src", "packages/kb-dashboard-compiler/src"]
reportIncompatibleVariableOverride = false

[[tool.basedpyright.executionEnvironments]]
root = "packages/kb-dashboard-lint/tests"
extraPaths = ["packages/kb-dashboard-lint/src", "packages/kb-dashboard-compiler/src"]
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportAny = false
reportArgumentType = false
reportCallIssue = false
reportMissingImports = false
reportUninitializedInstanceVariable = false
reportUnusedCallResult = false
reportImplicitOverride = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUntypedNamedTuple = false

[[tool.basedpyright.executionEnvironments]]
# export_lsp_schemas.py uses model_config without ClassVar because pydantic2zod
# parses source code directly and doesn't support ClassVar annotations
root = "packages/kb-dashboard-compiler/scripts/export_lsp_schemas.py"
reportUnannotatedClassAttribute = false
